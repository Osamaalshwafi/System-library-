<meta name='viewport' content='width=device-width, initial-scale=1'/><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبتك الرقمية | منصة تحميل التطبيقات والبرامج</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

    <style>
        /* === (تم الاحتفاظ بجميع تنسيقات CSS الأصلية الخاصة بك) === */
        :root { --bg: #f5f7fb; --surface: #ffffff; --surface-alt: #f0f2f8; --text: #1a1d2e; --text-secondary: #5a5f78; --text-muted: #8b8fa8; --primary: #5b4cf0; --primary-light: #7c6ff7; --primary-dark: #4338ca; --primary-glow: rgba(91, 76, 240, 0.25); --accent: #f7931e; --green: #10b981; --red: #ef4444; --border: #e5e7f0; --shadow-sm: 0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.06); --shadow: 0 4px 16px rgba(0,0,0,0.06),0 2px 6px rgba(0,0,0,0.04); --shadow-lg: 0 20px 50px rgba(0,0,0,0.1),0 8px 20px rgba(0,0,0,0.06); --shadow-xl: 0 32px 64px rgba(0,0,0,0.12),0 12px 32px rgba(0,0,0,0.08); --radius-sm: 10px; --radius: 16px; --radius-lg: 22px; --radius-xl: 28px; --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); --transition-fast: 0.18s cubic-bezier(0.4, 0, 0.2, 1); --transition-slow: 0.5s cubic-bezier(0.4, 0, 0.2, 1); --font: 'Segoe UI', 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }
        body { font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #d1d5e0; border-radius: 20px; } ::-webkit-scrollbar-thumb:hover { background: #b0b7c9; }
        .particles-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: hidden; }
        .particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; opacity: 0; }
        @keyframes floatUp { 0% { transform: translateY(105vh) scale(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.5; } 100% { transform: translateY(-10vh) scale(1.2); opacity: 0; } }
        .header { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); transition: var(--transition); padding: 0 20px; }
        .header.scrolled { box-shadow: var(--shadow); background: rgba(255, 255, 255, 0.92); }
        .nav { max-width: 1300px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 64px; gap: 16px; }
        .logo { display: flex; align-items: center; gap: 10px; font-size: 1.35rem; font-weight: 800; color: var(--primary); text-decoration: none; transition: var(--transition-fast); }
        .logo-icon { width: 42px; height: 42px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; font-size: 1.5rem; color: #fff; box-shadow: 0 4px 14px var(--primary-glow); }
        .btn { padding: 10px 20px; border-radius: 50px; font-weight: 600; font-size: 0.9rem; cursor: pointer; border: none; transition: var(--transition-fast); display: inline-flex; align-items: center; gap: 7px; font-family: var(--font); }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: #fff; box-shadow: 0 4px 14px var(--primary-glow); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(91, 76, 240, 0.35); }
        .btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
        .btn-outline:hover { background: var(--primary); color: #fff; transform: translateY(-2px); }
        .btn-ghost { background: transparent; color: var(--text-secondary); padding: 8px 14px; }
        .btn-ghost:hover { background: var(--surface-alt); color: var(--text); }
        .btn-sm { padding: 7px 14px; font-size: 0.8rem; border-radius: 40px; }
        .btn-success { background: var(--green); color: #fff; }
        .btn-success:hover { background: #059669; }
        .main-content { position: relative; z-index: 1; max-width: 1300px; margin: 0 auto; padding: 20px 20px 60px; }
        .hero { text-align: center; padding: 50px 20px 40px; animation: fadeInUp 0.7s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .hero h1 { font-size: clamp(2rem, 5vw, 3.2rem); font-weight: 900; margin-bottom: 12px; background: linear-gradient(135deg, var(--text) 30%, var(--primary-dark)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-subtitle { font-size: 1.1rem; color: var(--text-secondary); max-width: 600px; margin: 0 auto 24px; }
        .hero-stats { display: flex; justify-content: center; gap: 30px; flex-wrap: wrap; margin-top: 10px; }
        .hero-stat { text-align: center; }
        .hero-stat-value { font-size: 2rem; font-weight: 900; color: var(--primary); }
        .hero-stat-label { font-size: 0.85rem; color: var(--text-muted); }
        .search-wrapper { display: flex; align-items: center; background: var(--surface); border-radius: 60px; padding: 6px 6px 6px 22px; box-shadow: var(--shadow); border: 2px solid transparent; max-width: 650px; margin: 0 auto 20px; }
        .search-wrapper input { flex: 1; border: none; outline: none; font-size: 1rem; padding: 12px 6px; background: transparent; font-family: var(--font); }
        .search-btn { background: var(--primary); color: #fff; border: none; border-radius: 50px; padding: 12px 24px; cursor: pointer; font-weight: 700; font-size: 0.9rem; }
        .category-tabs { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px;}
        .cat-tab { padding: 10px 20px; border-radius: 50px; border: 2px solid var(--border); background: var(--surface); cursor: pointer; font-weight: 600; font-size: 0.88rem; color: var(--text-secondary); }
        .cat-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 14px var(--primary-glow); }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .app-card { background: var(--surface); border-radius: var(--radius-lg); padding: 22px; box-shadow: var(--shadow-sm); cursor: pointer; transition: var(--transition); border: 2px solid transparent; display: flex; flex-direction: column; gap: 12px; }
        .app-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-xl); border-color: var(--primary-light); }
        .app-card-header { display: flex; align-items: center; gap: 14px; }
        .app-icon { width: 56px; height: 56px; border-radius: var(--radius-sm); object-fit: cover; }
        .app-icon-placeholder { width: 56px; height: 56px; border-radius: var(--radius-sm); background: linear-gradient(135deg, var(--primary), var(--primary-light)); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; color: #fff; }
        .app-card-name { font-weight: 800; font-size: 1.05rem; }
        .app-card-desc { font-size: 0.88rem; color: var(--text-secondary); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .app-card-meta { display: flex; gap: 14px; font-size: 0.78rem; color: var(--text-muted); }
        .modal-overlay, .admin-overlay { position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(6px); display: flex; align-items: center; justify-content: center; padding: 20px; }
        .modal, .admin-panel { background: var(--surface); border-radius: var(--radius-xl); max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: var(--shadow-xl); padding: 28px; position: relative;}
        .modal-close { position: sticky; top: 12px; float: left; z-index: 10; width: 40px; height: 40px; border-radius: 50%; background: var(--surface-alt); border: none; cursor: pointer; font-size: 1.3rem; margin: 8px 8px 0 0; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 12px 16px; border: 2px solid var(--border); border-radius: var(--radius-sm); font-family: var(--font); font-size: 0.95rem; background: var(--surface-alt); }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .toast-container { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 999; display: flex; flex-direction: column; gap: 8px; }
        .toast { padding: 14px 22px; border-radius: 50px; color: #fff; font-weight: 700; font-size: 0.9rem; box-shadow: var(--shadow-lg); text-align: center; }
        .toast.success { background: #10b981; } .toast.error { background: #ef4444; } .toast.info { background: var(--primary); }
        .hidden { display: none !important; }
        .github-box { background: #f8fafc; border: 2px dashed #cbd5e1; padding: 16px; border-radius: var(--radius-sm); margin-bottom: 20px; }
        .file-upload-box { display: flex; gap: 10px; align-items: center; background: #e0f2fe; padding: 12px; border-radius: var(--radius-sm); margin-bottom: 16px; border: 1px solid #bae6fd;}
    </style>
</head>
<body>

    <div class="particles-container" id="particlesContainer"></div>

    <header class="header" id="header">
        <nav class="nav">
            <a href="#" class="logo">
                <div class="logo-icon">📱</div><span>مكتبتك الرقمية</span>
            </a>
            <button class="btn btn-ghost btn-sm" onclick="openAdminPanel()">⚙️ لوحة التحكم</button>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero">
            <h1>مكتبتك الرقمية المتكاملة</h1>
            <p class="hero-subtitle">حمّل أفضل التطبيقات والبرامج لهاتفك وحاسوبك من مكان واحد.</p>
            <div class="hero-stats">
                <div class="hero-stat"><div class="hero-stat-value" id="statAppsCount">0</div><div class="hero-stat-label">تطبيق</div></div>
                <div class="hero-stat"><div class="hero-stat-value" id="statDownloads">0</div><div class="hero-stat-label">تحميل</div></div>
            </div>
        </section>

        <section class="search-filter-section">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="🔍 ابحث عن تطبيق...">
                <button class="search-btn" onclick="performSearch()">بحث</button>
            </div>
            <div class="category-tabs" id="categoryTabs">
                <button class="cat-tab active" data-category="all">📋 الكل</button>
                <button class="cat-tab" data-category="mobile">📱 تطبيقات الهاتف</button>
                <button class="cat-tab" data-category="desktop">💻 تطبيقات الحاسوب</button>
                <button class="cat-tab" data-category="games">🎮 ألعاب</button>
            </div>
            <div id="resultsInfo" style="text-align:center; margin-bottom: 10px;"></div>
        </section>

        <section class="apps-grid" id="appsGrid"></section>
    </main>

    <div class="modal-overlay hidden" id="appModalOverlay">
        <div class="modal" id="appModal">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <div class="admin-overlay hidden" id="adminOverlay">
        <div class="admin-panel" id="adminPanel">
            <button class="modal-close" onclick="closeAdminPanel()">✕</button>
            <div id="adminContent"></div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // إعدادات فايربيز الخاصة بك (فقط قاعدة البيانات)
        const firebaseConfig = {
            apiKey: "AIzaSyDvDaK7HtwtQ_VmR9cKoDq6sdrUyL_Hfls",
            authDomain: "system-library-52cc1.firebaseapp.com",
            projectId: "system-library-52cc1",
            storageBucket: "system-library-52cc1.firebasestorage.app",
            messagingSenderId: "139702257477",
            appId: "1:139702257477:web:1615f6c263afb3e1d1e02c"
        };

        let db;
        try { firebase.initializeApp(firebaseConfig); db = firebase.firestore(); } catch (e) {}

        const ADMIN_PASSWORD = 'osama'; // غيرها كما تحب
        let allApps = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let isAdminLoggedIn = false;
        let editingAppId = null;
        let ghReleaseId = null; // لتخزين رقم الإصدار بعد فحصه

        const appsGrid = document.getElementById('appsGrid');
        const modalBody = document.getElementById('modalBody');
        const adminContent = document.getElementById('adminContent');
        const toastContainer = document.getElementById('toastContainer');

        function showToast(msg, type = 'info') {
            const t = document.createElement('div');
            t.className = `toast ${type}`; t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // --- عمليات فايربيز لجلب وحفظ التطبيقات ---
        async function fetchApps() {
            if(!db) return [];
            const snapshot = await db.collection('apps').orderBy('createdAt', 'desc').get();
            return snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
        }

        function renderApps() {
            let filtered = allApps.filter(a => currentCategory==='all' || a.category===currentCategory);
            if(searchQuery) filtered = filtered.filter(a => (a.name+a.shortDesc).includes(searchQuery));
            
            appsGrid.innerHTML = filtered.map(app => `
                <article class="app-card" onclick="openAppDetail('${app.id}')">
                    <div class="app-card-header">
                        <div class="app-icon-placeholder">${(app.name||'ت')[0]}</div>
                        <div><h3>${app.name}</h3><span style="color:var(--primary);font-size:0.8rem">${app.category}</span></div>
                    </div>
                    <p class="app-card-desc">${app.shortDesc}</p>
                    <div class="app-card-meta"><span>⬇️ ${app.downloads||0}</span> <span>📦 ${app.size||'-'}</span></div>
                </article>
            `).join('') || '<p style="text-align:center;grid-column:1/-1;">لا توجد تطبيقات</p>';
            
            document.getElementById('statAppsCount').textContent = allApps.length;
            document.getElementById('statDownloads').textContent = allApps.reduce((sum, a) => sum + (a.downloads||0), 0);
        }

        function openAppDetail(id) {
            const app = allApps.find(a => a.id === id);
            modalBody.innerHTML = `
                <h2>${app.name}</h2>
                <p style="margin:10px 0;">${app.fullDesc || app.shortDesc}</p>
                <a href="${app.downloadUrl}" target="_blank" class="btn btn-primary" onclick="incDownload('${app.id}')" style="width:100%;justify-content:center;padding:15px;font-size:1.1rem;">⬇️ تحميل الآن</a>
            `;
            document.getElementById('appModalOverlay').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('appModalOverlay').classList.add('hidden'); }
        
        async function incDownload(id) {
            if(db) await db.collection('apps').doc(id).update({downloads: firebase.firestore.FieldValue.increment(1)});
        }

        // --- لوحة التحكم وإعدادات GitHub ---
        function openAdminPanel() {
            if(!isAdminLoggedIn) {
                adminContent.innerHTML = `<h2>🔐 دخول لوحة التحكم</h2>
                <input type="password" id="adminPwd" class="form-group" style="width:100%;padding:10px;margin-bottom:10px;" placeholder="كلمة المرور">
                <button class="btn btn-primary" onclick="if(document.getElementById('adminPwd').value==='${ADMIN_PASSWORD}'){isAdminLoggedIn=true;showAdminDashboard();}else{showToast('خطأ','error')}">دخول</button>`;
            } else { showAdminDashboard(); }
            document.getElementById('adminOverlay').classList.remove('hidden');
        }
        function closeAdminPanel() { document.getElementById('adminOverlay').classList.add('hidden'); }

        function showAdminDashboard() {
            // جلب الإعدادات المحفوظة مسبقاً من المتصفح
            const savedGH = JSON.parse(localStorage.getItem('gh_config')) || {owner: 'Osamaalshwafi', repo: 'my-apps', tag: 'v1.0.0', token: ''};
            
            adminContent.innerHTML = `
                <h2>⚙️ لوحة التحكم</h2>
                
                <div class="github-box">
                    <h3 style="margin-bottom:10px;">🐙 إعدادات رفع الملفات (GitHub)</h3>
                    <div class="form-row">
                        <div class="form-group"><label>اسم الحساب (Owner)</label><input type="text" id="ghOwner" value="${savedGH.owner}"></div>
                        <div class="form-group"><label>اسم المستودع (Repo)</label><input type="text" id="ghRepo" value="${savedGH.repo}"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>اسم الإصدار (Tag)</label><input type="text" id="ghTag" value="${savedGH.tag}"></div>
                        <div class="form-group"><label>التوكن (Token)</label><input type="password" id="ghToken" value="${savedGH.token}" placeholder="ghp_xxxxxxxxxxxx"></div>
                    </div>
                    <button class="btn btn-outline" id="btnTestGH" onclick="testGitHubConnection()">🔄 فحص الاتصال بـ GitHub</button>
                    <span id="ghStatus" style="font-size:0.85rem; margin-right:10px; font-weight:bold;"></span>
                </div>

                <div style="margin-bottom:20px;">
                    <button class="btn btn-primary" onclick="showAppForm()">➕ إضافة تطبيق</button>
                    <button class="btn btn-ghost" onclick="isAdminLoggedIn=false;closeAdminPanel()">خروج</button>
                </div>
                
                <div id="adminFormArea"></div>
            `;
        }

        // دالة فحص اتصال جيتهاب وجلب Release ID
        async function testGitHubConnection() {
            const owner = document.getElementById('ghOwner').value.trim();
            const repo = document.getElementById('ghRepo').value.trim();
            const tag = document.getElementById('ghTag').value.trim();
            const token = document.getElementById('ghToken').value.trim();
            const statusSpan = document.getElementById('ghStatus');
            
            if(!token) return showToast('الرجاء إدخال التوكن', 'error');

            // حفظ في المتصفح
            localStorage.setItem('gh_config', JSON.stringify({owner, repo, tag, token}));
            
            statusSpan.textContent = 'جاري الفحص...';
            statusSpan.style.color = 'var(--text)';

            try {
                // الفحص عبر api.github.com
                const response = await fetch(`https://api.github.com/repos/${owner}/${repo}/releases/tags/${tag}`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    ghReleaseId = data.id; // حفظ الـ ID الخاص بالإصدار لاستخدامه في الرفع
                    statusSpan.textContent = `✅ متصل! جاهز للرفع (Release ID: ${ghReleaseId})`;
                    statusSpan.style.color = 'var(--green)';
                    showToast('تم الاتصال بجيتهاب بنجاح!', 'success');
                } else {
                    statusSpan.textContent = '❌ ' + (data.message === 'Not Found' ? 'الإصدار أو المستودع غير موجود' : data.message);
                    statusSpan.style.color = 'var(--red)';
                }
            } catch (error) {
                statusSpan.textContent = '❌ خطأ في الاتصال بالشبكة';
                statusSpan.style.color = 'var(--red)';
            }
        }

        function showAppForm() {
            document.getElementById('adminFormArea').innerHTML = `
                <div style="background:var(--surface); border:1px solid var(--border); padding:20px; border-radius:10px;">
                    <h3>📝 بيانات التطبيق</h3>
                    <div class="form-group">
                        <label>اسم التطبيق</label><input type="text" id="appName">
                    </div>
                    
                    <div class="file-upload-box">
                        <input type="file" id="localFile" style="flex:1;">
                        <button class="btn btn-success" id="btnUpload" onclick="uploadToGitHub()">⬆️ رفع إلى GitHub</button>
                    </div>

                    <div class="form-group">
                        <label>رابط التحميل المباشر (سيتم ملؤه تلقائياً بعد الرفع)</label>
                        <input type="text" id="appDownloadUrl" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>وصف مختصر</label><input type="text" id="appShort"></div>
                        <div class="form-group"><label>الحجم</label><input type="text" id="appSize"></div>
                    </div>
                    <button class="btn btn-primary" onclick="saveApp()">💾 حفظ في قاعدة البيانات</button>
                </div>
            `;
        }

        // دالة الرفع المباشر للملف (تطبيق القواعد الثلاث)
        async function uploadToGitHub() {
            const fileInput = document.getElementById('localFile');
            const file = fileInput.files[0];
            const btn = document.getElementById('btnUpload');
            
            if (!file) return showToast('⚠️ الرجاء اختيار ملف أولاً من جهازك', 'error');
            if (!ghReleaseId) return showToast('⚠️ الرجاء النقر على "فحص الاتصال" في إعدادات جيتهاب أولاً', 'error');

            const ghConfig = JSON.parse(localStorage.getItem('gh_config'));
            
            // القاعدة 1: التوجيه لخادم uploads.github.com
            const uploadUrl = `https://uploads.github.com/repos/${ghConfig.owner}/${ghConfig.repo}/releases/${ghReleaseId}/assets?name=${encodeURIComponent(file.name)}`;

            btn.textContent = '⏳ جاري الرفع...';
            btn.disabled = true;

            try {
                const response = await fetch(uploadUrl, {
                    method: 'POST',
                    headers: {
                        // القاعدة 2: إرفاق التوكن
                        'Authorization': `Bearer ${ghConfig.token}`,
                        // القاعدة 3: نوع الملف (بيانات خام)
                        'Content-Type': 'application/octet-stream'
                    },
                    body: file // إرسال الملف مباشرة
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('✅ تم رفع التطبيق بنجاح!', 'success');
                    // استخراج الرابط المباشر ووضعه في الحقل
                    document.getElementById('appDownloadUrl').value = data.browser_download_url;
                    
                    // حساب الحجم ووضعه في الحقل تلقائياً (MB)
                    const sizeMB = (file.size / (1024 * 1024)).toFixed(2);
                    document.getElementById('appSize').value = `${sizeMB} MB`;
                } else {
                    // إذا كان الملف موجوداً مسبقاً بنفس الاسم
                    if(data.errors && data.errors[0].code === 'already_exists') {
                        showToast('❌ ملف بنفس الاسم موجود مسبقاً في هذا الإصدار', 'error');
                    } else {
                        showToast('❌ فشل الرفع: ' + data.message, 'error');
                    }
                }
            } catch (error) {
                showToast('❌ انقطع الاتصال أثناء الرفع', 'error');
            } finally {
                btn.textContent = '⬆️ رفع إلى GitHub';
                btn.disabled = false;
            }
        }

        async function saveApp() {
            const name = document.getElementById('appName').value;
            const link = document.getElementById('appDownloadUrl').value;
            if(!name || !link) return showToast('الاسم والرابط مطلوبان','error');
            
            await db.collection('apps').add({
                name, downloadUrl: link,
                shortDesc: document.getElementById('appShort').value,
                size: document.getElementById('appSize').value,
                category: 'mobile', downloads: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            showToast('تم حفظ التطبيق!','success');
            document.getElementById('adminFormArea').innerHTML='';
            init();
        }

        document.getElementById('searchInput').addEventListener('input', (e) => { searchQuery = e.target.value; renderApps(); });
        document.getElementById('categoryTabs').addEventListener('click', (e) => {
            if(e.target.tagName==='BUTTON') {
                document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
                e.target.classList.add('active');
                currentCategory = e.target.dataset.category; renderApps();
            }
        });

        async function init() {
            // توليد النجوم الخلفية
            for(let i=0;i<20;i++){
                let p = document.createElement('div'); p.className='particle';
                p.style.cssText=`width:10px;height:10px;background:var(--primary);left:${Math.random()*100}%;animation-duration:${Math.random()*10+5}s`;
                document.getElementById('particlesContainer').appendChild(p);
            }
            allApps = await fetchApps(); renderApps();
        }
        init();
    </script>
</body>
</html>
