<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مكتبتك الرقمية | منصة تحميل التطبيقات</title>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #fff;
            --surface-alt: #f0f2f8;
            --text: #1a1d2e;
            --text-secondary: #5a5f78;
            --text-muted: #8b8fa8;
            --primary: #5b4cf0;
            --primary-dark: #4338ca;
            --primary-glow: rgba(91,76,240,0.25);
            --accent: #f7931e;
            --green: #10b981;
            --red: #ef4444;
            --border: #e5e7f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.1);
            --radius-sm: 10px;
            --radius: 16px;
            --transition: 0.3s;
            --font: 'Segoe UI','Tajawal',sans-serif;
        }
        * {margin:0;padding:0;box-sizing:border-box}
        body {font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.6}
        .header {position:sticky;top:0;background:rgba(255,255,255,0.8);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 20px;z-index:100}
        .nav {max-width:1300px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;height:64px}
        .logo {font-size:1.5rem;font-weight:800;color:var(--primary);text-decoration:none}
        .btn {padding:10px 20px;border-radius:50px;font-weight:600;border:none;cursor:pointer;background:var(--primary);color:#fff;font-size:0.9rem;display:inline-flex;align-items:center;gap:6px}
        .btn-outline {background:transparent;color:var(--primary);border:2px solid var(--primary)}
        .btn-danger {background:var(--red)}
        .btn-sm {padding:6px 14px;font-size:0.8rem}
        .hero {text-align:center;padding:50px 20px}
        .hero h1 {font-size:clamp(2rem,5vw,3rem);font-weight:900;background:linear-gradient(135deg,var(--text),var(--primary-dark));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .apps-grid {display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px;max-width:1300px;margin:20px auto;padding:0 20px}
        .app-card {background:var(--surface);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow-sm);cursor:pointer;transition:var(--transition)}
        .app-card:hover {transform:translateY(-5px);box-shadow:var(--shadow-lg)}
        .app-icon {width:56px;height:56px;border-radius:var(--radius-sm);object-fit:cover;background:var(--surface-alt);display:flex;align-items:center;justify-content:center;font-size:1.8rem;color:#fff;background:linear-gradient(135deg,var(--primary),#7c6ff7)}
        .app-name {font-weight:800;margin:8px 0}
        .modal-overlay {position:fixed;inset:0;background:rgba(0,0,0,0.5);backdrop-filter:blur(5px);display:flex;align-items:center;justify-content:center;z-index:200}
        .modal {background:var(--surface);border-radius:var(--radius);max-width:500px;width:90%;padding:30px;max-height:85vh;overflow-y:auto}
        .btn-download {display:block;width:100%;padding:16px;background:var(--green);color:#fff;border:none;border-radius:60px;font-size:1.1rem;font-weight:800;margin-top:20px;cursor:pointer}
        .hidden {display:none}
        .toast {position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:12px 24px;border-radius:50px;z-index:999}
        .form-group {margin-bottom:16px}
        .form-group label {display:block;font-weight:700;margin-bottom:5px}
        .form-group input, .form-group textarea, .form-group select {width:100%;padding:10px 14px;border:2px solid var(--border);border-radius:var(--radius-sm);font-family:var(--font)}
        .debug-box {background:#1e1e2f;color:#a0ffa0;padding:10px;border-radius:8px;font-family:monospace;font-size:0.85rem;white-space:pre-wrap;margin-top:10px;max-height:150px;overflow-y:auto}
        .progress-container {margin-top:8px;background:var(--surface-alt);border-radius:50px;height:10px;overflow:hidden}
        .progress-bar {height:100%;width:0%;background:var(--primary);border-radius:50px;transition:width 0.3s}
        .footer {text-align:center;padding:30px;color:var(--text-muted)}
    </style>
</head>
<body>
    <header class="header"><nav class="nav"><a href="#" class="logo">📱 مكتبتك الرقمية</a><button class="btn" onclick="openAdmin()">⚙️ لوحة التحكم</button></nav></header>
    <section class="hero"><h1>مكتبتك الرقمية المتكاملة</h1><p>حمل التطبيقات مباشرة إلى جهازك</p></section>
    <div class="apps-grid" id="appsGrid"></div>
    <footer class="footer">© 2025 مكتبتك الرقمية</footer>

    <!-- App Modal -->
    <div class="modal-overlay hidden" id="appModal"><div class="modal"><button onclick="closeAppModal()" style="float:left;background:none;border:none;font-size:1.5rem;">✕</button><div id="modalBody"></div></div></div>
    <!-- Admin Modal -->
    <div class="modal-overlay hidden" id="adminModal"><div class="modal" style="max-width:700px;"><button onclick="closeAdmin()" style="float:left;background:none;border:none;font-size:1.5rem;">✕</button><div id="adminContent"></div></div></div>

    <script>
        // Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyDvDaK7HtwtQ_VmR9cKoDq6sdrUyL_Hfls",
            authDomain: "system-library-52cc1.firebaseapp.com",
            projectId: "system-library-52cc1",
            storageBucket: "system-library-52cc1.firebasestorage.app",
            messagingSenderId: "139702257477",
            appId: "1:139702257477:web:1615f6c263afb3e1d1e02c"
        });
        const db = firebase.firestore();
        const ADMIN_PASS = 'admin2025digital';
        let apps = [], isAdmin = false, githubToken = localStorage.getItem('gt') || '', githubRepo = localStorage.getItem('gr') || '';

        // Toast & Debug
        function toast(msg, type='info') { const t = document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
        function showDebug(title, text) { const d = document.getElementById('debugContainer'); if(d) d.innerHTML = `<strong>${title}:</strong><div class="debug-box">${text}</div>`; }

        // Load Apps
        async function loadApps() {
            const snap = await db.collection('apps').orderBy('createdAt','desc').get();
            apps = []; snap.forEach(d => apps.push({id:d.id, ...d.data()}));
            document.getElementById('appsGrid').innerHTML = apps.length ? apps.map(a => `
                <div class="app-card" onclick="openApp('${a.id}')">
                    <div class="app-icon">📦</div>
                    <div class="app-name">${a.name}</div>
                    <div>${a.shortDesc||''}</div>
                </div>`).join('') : '<p>لا توجد تطبيقات</p>';
        }

        function openApp(id) {
            const a = apps.find(x=>x.id===id); if(!a) return;
            document.getElementById('modalBody').innerHTML = `
                <h2>${a.name}</h2>
                <p>${a.fullDesc||a.shortDesc}</p>
                <a href="${a.downloadUrl}" class="btn-download" onclick="event.preventDefault();downloadApp('${a.id}','${a.downloadUrl}')">⬇️ تحميل الآن</a>
            `;
            document.getElementById('appModal').classList.remove('hidden');
        }
        function closeAppModal() { document.getElementById('appModal').classList.add('hidden'); }
        async function downloadApp(id, url) {
            await db.collection('apps').doc(id).update({downloads:firebase.firestore.FieldValue.increment(1)});
            const a = document.createElement('a'); a.href=url; a.download=''; document.body.appendChild(a); a.click(); a.remove();
            toast('✅ جاري التحميل...');
        }

        // Admin
        function openAdmin() {
            if(!isAdmin) showLogin(); else showDashboard();
            document.getElementById('adminModal').classList.remove('hidden');
        }
        function closeAdmin() { document.getElementById('adminModal').classList.add('hidden'); }
        function showLogin() {
            document.getElementById('adminContent').innerHTML = `<h2>دخول</h2><input id="pass" placeholder="كلمة المرور" style="width:100%;padding:10px;"><br><button class="btn" onclick="login()">دخول</button>`;
        }
        function login() {
            if(document.getElementById('pass').value===ADMIN_PASS){ isAdmin=true; showDashboard(); } else toast('❌ خطأ');
        }
        function showDashboard() {
            document.getElementById('adminContent').innerHTML = `
                <h2>لوحة التحكم</h2>
                <button class="btn btn-sm" onclick="showAddForm()">➕ إضافة تطبيق</button>
                <button class="btn btn-sm btn-outline" onclick="showGitHubSettings()">🔑 إعدادات GitHub</button>
                <div style="margin-top:20px;">${apps.map(a=>`<div>${a.name} <button class="btn-danger btn-sm" onclick="deleteApp('${a.id}')">حذف</button></div>`).join('')}</div>
                <div id="formContainer"></div>`;
        }

        function showGitHubSettings() {
            document.getElementById('formContainer').innerHTML = `
                <h3>إعدادات GitHub</h3>
                <div class="form-group"><label>رمز الوصول</label><input id="ghToken" value="${githubToken}" placeholder="github_pat_..."></div>
                <div class="form-group"><label>اسم المستودع (owner/repo)</label><input id="ghRepo" value="${githubRepo}" placeholder="ahmed/my-apps"></div>
                <button class="btn btn-sm" onclick="verifyConnection()">📡 تحقق من الاتصال</button>
                <button class="btn btn-sm" onclick="saveGHSettings()">💾 حفظ</button>
                <div id="debugContainer" style="margin-top:12px;"></div>`;
        }

        async function verifyConnection() {
            const token = document.getElementById('ghToken').value.trim();
            const repo = document.getElementById('ghRepo').value.trim().replace(/\s/g,'');
            if(!token||!repo) return showDebug('خطأ','أدخل البيانات');
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}`, {headers:{Authorization:`token ${token}`}});
                const data = await res.json();
                if(res.ok) showDebug('✅ نجاح', `المستودع: ${data.full_name}`);
                else showDebug('❌ فشل', `HTTP ${res.status}: ${data.message}`);
            } catch(e) { showDebug('❌', e.message); }
        }

        function saveGHSettings() {
            githubToken = document.getElementById('ghToken').value.trim();
            githubRepo = document.getElementById('ghRepo').value.trim().replace(/\s/g,'');
            localStorage.setItem('gt', githubToken);
            localStorage.setItem('gr', githubRepo);
            toast('✅ تم الحفظ');
            showDashboard();
        }

        function showAddForm() {
            document.getElementById('formContainer').innerHTML = `
                <h3>إضافة تطبيق</h3>
                <div class="form-group"><label>اسم التطبيق (عربي) *</label><input id="appName"></div>
                <div class="form-group"><label>اسم إنجليزي</label><input id="appNameEn"></div>
                <div class="form-group"><label>وصف مختصر</label><textarea id="appShortDesc"></textarea></div>
                <div class="form-group"><label>وصف كامل</label><textarea id="appFullDesc"></textarea></div>
                <div class="form-group"><label>الإصدار</label><input id="appVersion"></div>
                <div class="form-group"><label>الحجم</label><input id="appSize"></div>
                <div class="form-group"><label>المطور</label><input id="appDeveloper"></div>
                <div class="form-group"><label>رابط الأيقونة</label><input id="appIconUrl"></div>
                <div class="form-group"><label>ملف التطبيق (APK/EXE)</label><input type="file" id="appFile"></div>
                <button class="btn btn-sm" onclick="uploadToGitHub()">📤 رفع إلى GitHub</button>
                <div id="uploadStatus" style="margin-top:8px;"><div class="progress-container" id="progressContainer" style="display:none"><div class="progress-bar" id="progressBar"></div></div><div id="progressText"></div></div>
                <div class="form-group"><label>أو رابط تحميل مباشر (Google Drive)</label><input id="manualDownloadUrl" placeholder="https://drive.google.com/uc?export=download&id=..."><small>ادخل رابطاً مباشراً إذا تعذر الرفع</small></div>
                <input type="hidden" id="appDownloadUrl">
                <div class="form-group"><label>وسوم</label><input id="appTags"></div>
                <button class="btn" onclick="saveApp()">💾 حفظ</button>`;
        }

        async function uploadToGitHub() {
            if (!githubToken || !githubRepo) { toast('⚠️ أعد إعدادات GitHub أولاً'); return; }
            const fileInput = document.getElementById('appFile');
            if (!fileInput.files.length) { toast('⚠️ اختر ملفاً'); return; }
            const file = fileInput.files[0];
            // تنظيف الاسم
            let cleanName = file.name.replace(/\s+/g, '_');
            cleanName = cleanName.replace(/[^\w.-]/g, '');
            if (cleanName.length > 100) cleanName = cleanName.substring(0, 100);
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const hiddenInput = document.getElementById('appDownloadUrl');
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            progressText.textContent = '0%';
            try {
                // إصدارة
                progressText.textContent = '⏳ تجهيز الإصدارة...';
                let releaseId;
                let resp = await fetch(`https://api.github.com/repos/${githubRepo}/releases?per_page=1`, {headers:{Authorization:`token ${githubToken}`}});
                if(resp.ok) {
                    const rels = await resp.json();
                    if(rels.length) releaseId = rels[0].id;
                }
                if(!releaseId) {
                    resp = await fetch(`https://api.github.com/repos/${githubRepo}/releases`, {
                        method:'POST',
                        headers:{Authorization:`token ${githubToken}`,'Content-Type':'application/json'},
                        body:JSON.stringify({tag_name:'v1.'+Date.now(),name:'تطبيقات',body:'ملفات التطبيقات',draft:false,prerelease:false})
                    });
                    if(!resp.ok) {
                        const err = await resp.json();
                        throw new Error('فشل إنشاء الإصدارة: ' + JSON.stringify(err));
                    }
                    const data = await resp.json();
                    releaseId = data.id;
                }
                // رفع
                progressText.textContent = '0%';
                const uploadUrl = `https://uploads.github.com/repos/${githubRepo}/releases/${releaseId}/assets?name=${encodeURIComponent(cleanName)}`;
                const xhr = new XMLHttpRequest();
                xhr.open('POST', uploadUrl);
                xhr.setRequestHeader('Authorization', `token ${githubToken}`);
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                xhr.upload.onprogress = (e) => {
                    if(e.lengthComputable){
                        const pct = Math.round(e.loaded/e.total*100);
                        progressBar.style.width = pct+'%';
                        progressText.textContent = pct+'%';
                    }
                };
                xhr.onload = () => {
                    if(xhr.status >= 200 && xhr.status < 300) {
                        const asset = JSON.parse(xhr.responseText);
                        hiddenInput.value = asset.browser_download_url;
                        progressText.textContent = '✅ تم الرفع';
                        toast('✅ رفع ناجح');
                    } else {
                        let detail = xhr.responseText;
                        try { detail = JSON.stringify(JSON.parse(xhr.responseText), null, 2); } catch(e){}
                        progressText.textContent = '❌ فشل الرفع';
                        showDebug('❌ استجابة الخادم', detail);
                    }
                    setTimeout(()=>progressContainer.style.display='none', 2000);
                };
                xhr.onerror = () => { progressText.textContent = '❌ خطأ شبكة'; progressContainer.style.display='none'; };
                xhr.send(file);
            } catch(e) {
                progressText.textContent = '❌ ' + e.message;
                showDebug('❌ استثناء', e.message);
                progressContainer.style.display = 'none';
            }
        }

        async function saveApp() {
            const name = document.getElementById('appName').value.trim();
            const downloadUrl = document.getElementById('appDownloadUrl').value.trim() || document.getElementById('manualDownloadUrl').value.trim();
            if(!name || !downloadUrl) return toast('⚠️ املأ الحقول المطلوبة');
            await db.collection('apps').add({
                name,
                nameEn: document.getElementById('appNameEn').value.trim(),
                shortDesc: document.getElementById('appShortDesc').value.trim(),
                fullDesc: document.getElementById('appFullDesc').value.trim(),
                version: document.getElementById('appVersion').value.trim(),
                size: document.getElementById('appSize').value.trim(),
                developer: document.getElementById('appDeveloper').value.trim(),
                iconUrl: document.getElementById('appIconUrl').value.trim(),
                downloadUrl,
                tags: document.getElementById('appTags').value.split(',').map(t=>t.trim()).filter(Boolean),
                downloads:0,
                createdAt:firebase.firestore.FieldValue.serverTimestamp()
            });
            closeAdmin();
            loadApps();
            toast('✅ تمت الإضافة');
        }

        async function deleteApp(id) {
            if(confirm('حذف؟')) { await db.collection('apps').doc(id).delete(); loadApps(); }
        }

        loadApps();
    </script>
</body>
</html>
