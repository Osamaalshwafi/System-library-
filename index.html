<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="مكتبتك الرقمية - منصة تحميل التطبيقات المجانية للهاتف والحاسوب.">
    <title>مكتبتك الرقمية | منصة تحميل التطبيقات</title>
    <!-- Firebase (Firestore) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --surface-alt: #f0f2f8;
            --text: #1a1d2e;
            --text-secondary: #5a5f78;
            --text-muted: #8b8fa8;
            --primary: #5b4cf0;
            --primary-light: #7c6ff7;
            --primary-dark: #4338ca;
            --primary-glow: rgba(91, 76, 240, 0.25);
            --accent: #f7931e;
            --green: #10b981;
            --red: #ef4444;
            --border: #e5e7f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04);
            --shadow: 0 4px 16px rgba(0,0,0,0.06);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.1);
            --shadow-xl: 0 32px 64px rgba(0,0,0,0.12);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', 'Tajawal', 'Cairo', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.6; }
        .header { position:sticky; top:0; background:rgba(255,255,255,0.8); backdrop-filter:blur(20px); border-bottom:1px solid var(--border); padding:0 20px; z-index:100; }
        .nav { max-width:1300px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; }
        .logo { font-size:1.5rem; font-weight:800; color:var(--primary); text-decoration:none; }
        .btn { padding:10px 20px; border-radius:50px; font-weight:600; border:none; cursor:pointer; background:var(--primary); color:#fff; font-size:0.9rem; transition:0.2s; }
        .btn-outline { background:transparent; color:var(--primary); border:2px solid var(--primary); }
        .btn-danger { background:var(--red); }
        .btn-sm { padding:6px 14px; font-size:0.8rem; }
        .hero { text-align:center; padding:50px 20px; }
        .hero h1 { font-size:clamp(2rem,5vw,3.2rem); font-weight:900; background:linear-gradient(135deg,var(--text),var(--primary-dark)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .apps-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; max-width:1300px; margin:20px auto; padding:0 20px; }
        .app-card { background:var(--surface); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow-sm); cursor:pointer; transition:var(--transition); }
        .app-card:hover { transform:translateY(-5px); box-shadow:var(--shadow-xl); }
        .app-icon { width:56px; height:56px; border-radius:var(--radius-sm); object-fit:cover; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-size:1.8rem; color:#fff; background:linear-gradient(135deg,var(--primary),var(--primary-light)); }
        .app-name { font-weight:800; margin:8px 0; }
        .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; z-index:200; }
        .modal { background:var(--surface); border-radius:var(--radius-xl); max-width:500px; width:90%; padding:30px; max-height:85vh; overflow-y:auto; }
        .btn-download { display:block; width:100%; padding:16px; background:var(--green); color:#fff; border:none; border-radius:60px; font-size:1.1rem; font-weight:800; margin-top:20px; cursor:pointer; }
        .hidden { display:none; }
        .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#10b981; color:#fff; padding:12px 24px; border-radius:50px; z-index:999; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-weight:700; margin-bottom:5px; }
        .form-group input, .form-group textarea, .form-group select { width:100%; padding:10px 14px; border:2px solid var(--border); border-radius:var(--radius-sm); font-family:var(--font); }
        .debug-box { background: #1e1e2f; color: #a0ffa0; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; margin-top: 10px; max-height: 120px; overflow-y: auto; }
        .footer { text-align:center; padding:30px; color:var(--text-muted); }
    </style>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="#" class="logo">📱 مكتبتك الرقمية</a>
            <button class="btn" onclick="openAdminPanel()">⚙️ لوحة التحكم</button>
        </nav>
    </header>

    <section class="hero">
        <h1>مكتبتك الرقمية المتكاملة</h1>
        <p>حمل التطبيقات مباشرة إلى جهازك</p>
    </section>

    <div class="apps-grid" id="appsGrid"></div>
    <footer class="footer">© 2025 مكتبتك الرقمية</footer>

    <!-- App Modal -->
    <div class="modal-overlay hidden" id="appModal">
        <div class="modal">
            <button onclick="closeModal()" style="float:left;background:none;border:none;font-size:1.5rem;">✕</button>
            <div id="modalBody"></div>
        </div>
    </div>
    <!-- Admin Modal -->
    <div class="modal-overlay hidden" id="adminModal">
        <div class="modal" style="max-width:650px;">
            <button onclick="closeAdminPanel()" style="float:left;background:none;border:none;font-size:1.5rem;">✕</button>
            <div id="adminContent"></div>
        </div>
    </div>

    <script>
        // Firebase
        firebase.initializeApp({
            apiKey: "AIzaSyDvDaK7HtwtQ_VmR9cKoDq6sdrUyL_Hfls",
            authDomain: "system-library-52cc1.firebaseapp.com",
            projectId: "system-library-52cc1",
            storageBucket: "system-library-52cc1.firebasestorage.app",
            messagingSenderId: "139702257477",
            appId: "1:139702257477:web:1615f6c263afb3e1d1e02c"
        });
        const db = firebase.firestore();
        const ADMIN_PASS = 'admin2025digital';
        let apps = [], isAdmin = false;

        // GitHub settings
        let githubToken = localStorage.getItem('github_token') || '';
        let githubRepo = localStorage.getItem('github_repo') || '';
        let githubBranch = localStorage.getItem('github_branch') || 'main';

        // Helper to show debug info
        function showDebug(title, text) {
            const container = document.getElementById('debugContainer');
            if (container) {
                container.innerHTML = `<strong>${title}:</strong><div class="debug-box">${text}</div>`;
            }
        }

        // Load apps
        async function loadApps() {
            const snap = await db.collection('apps').orderBy('createdAt','desc').get();
            apps = [];
            snap.forEach(d => apps.push({id:d.id, ...d.data()}));
            renderApps();
        }
        function renderApps() {
            const grid = document.getElementById('appsGrid');
            if (!apps.length) { grid.innerHTML = '<p>لا توجد تطبيقات</p>'; return; }
            grid.innerHTML = apps.map(app => `
                <div class="app-card" onclick="openApp('${app.id}')">
                    <div class="app-icon">📦</div>
                    <div class="app-name">${app.name}</div>
                    <div>${app.shortDesc||''}</div>
                </div>
            `).join('');
        }

        function openApp(id) {
            const app = apps.find(a=>a.id===id);
            if(!app) return;
            document.getElementById('modalBody').innerHTML = `
                <h2>${app.name}</h2>
                <p>${app.fullDesc||app.shortDesc}</p>
                <a href="${app.downloadUrl}" class="btn-download" onclick="event.preventDefault();downloadDirect('${app.downloadUrl}','${app.id}')">⬇️ تحميل الآن</a>
            `;
            document.getElementById('appModal').classList.remove('hidden');
        }
        function closeModal() { document.getElementById('appModal').classList.add('hidden'); }
        async function downloadDirect(url, id) {
            await db.collection('apps').doc(id).update({downloads:firebase.firestore.FieldValue.increment(1)});
            const a = document.createElement('a');
            a.href = url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            showToast('✅ جاري التحميل...');
        }

        function showToast(msg, type='info') {
            const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
            document.body.appendChild(t); setTimeout(()=>t.remove(), 3000);
        }

        // Admin Panel
        function openAdminPanel() {
            if(!isAdmin) showLogin(); else showDashboard();
            document.getElementById('adminModal').classList.remove('hidden');
        }
        function closeAdminPanel() { document.getElementById('adminModal').classList.add('hidden'); }
        function showLogin() {
            document.getElementById('adminContent').innerHTML = `
                <h2>دخول</h2>
                <input id="pass" placeholder="كلمة المرور" style="width:100%;padding:10px;"><br>
                <button class="btn" onclick="login()">دخول</button>
            `;
        }
        function login() {
            if(document.getElementById('pass').value===ADMIN_PASS){ isAdmin=true; showDashboard(); }
            else alert('خطأ');
        }
        function showDashboard() {
            document.getElementById('adminContent').innerHTML = `
                <h2>لوحة التحكم</h2>
                <button class="btn btn-sm" onclick="showAddForm()">➕ إضافة تطبيق</button>
                <button class="btn btn-sm btn-outline" onclick="showGitHubSettings()">🔑 إعدادات GitHub</button>
                <div id="adminAppList" style="margin-top:20px;">${apps.map(a=>`<div>${a.name} <button onclick="deleteApp('${a.id}')">حذف</button></div>`).join('')}</div>
                <div id="formContainer"></div>
            `;
        }

        function showGitHubSettings() {
            document.getElementById('formContainer').innerHTML = `
                <h3>إعدادات GitHub</h3>
                <div class="form-group"><label>رمز الوصول</label><input type="password" id="ghToken" value="${githubToken}"></div>
                <div class="form-group"><label>اسم المستودع (owner/repo)</label><input id="ghRepo" value="${githubRepo}" placeholder="مثال: ahmed/my-apps"></div>
                <div class="form-group"><label>الفرع</label><input id="ghBranch" value="${githubBranch}"></div>
                <button class="btn btn-sm" onclick="verifyConnection()">📡 تحقق من الاتصال</button>
                <button class="btn btn-sm" onclick="saveGitHubSettings()">💾 حفظ</button>
                <div id="debugContainer"></div>
            `;
        }

        async function verifyConnection() {
            const token = document.getElementById('ghToken').value.trim();
            let repo = document.getElementById('ghRepo').value.trim();
            if (!token || !repo) {
                showDebug('خطأ', 'الرجاء إدخال الرمز واسم المستودع');
                return;
            }
            // تنظيف اسم المستودع
            repo = repo.replace(/\s/g, '');
            if (!repo.includes('/')) {
                showDebug('خطأ', 'اسم المستودع يجب أن يكون بصيغة owner/repo');
                return;
            }
            showDebug('⏳', 'جاري التحقق...');
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}`, {
                    headers: { Authorization: `token ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    showDebug('✅ نجاح', 'تم الاتصال بالمستودع بنجاح.\nالاسم: ' + data.full_name);
                } else {
                    showDebug('❌ فشل', `حالة HTTP: ${res.status}\nالرسالة: ${data.message || 'غير معروف'}\nتأكد من أن الرمز لديه صلاحية الوصول إلى المستودع وأن المستودع موجود.`);
                }
            } catch (e) {
                showDebug('❌ خطأ في الشبكة', e.message);
            }
        }

        function saveGitHubSettings() {
            githubToken = document.getElementById('ghToken').value.trim();
            githubRepo = document.getElementById('ghRepo').value.trim().replace(/\s/g, '');
            githubBranch = document.getElementById('ghBranch').value.trim() || 'main';
            localStorage.setItem('github_token', githubToken);
            localStorage.setItem('github_repo', githubRepo);
            localStorage.setItem('github_branch', githubBranch);
            showToast('✅ تم الحفظ');
            showDashboard();
        }

        function showAddForm() {
            document.getElementById('formContainer').innerHTML = `
                <h3>إضافة تطبيق</h3>
                <div class="form-group"><label>اسم التطبيق (عربي) *</label><input id="appName"></div>
                <div class="form-group"><label>اسم إنجليزي</label><input id="appNameEn"></div>
                <div class="form-group"><label>وصف مختصر</label><textarea id="appShortDesc"></textarea></div>
                <div class="form-group"><label>وصف كامل</label><textarea id="appFullDesc"></textarea></div>
                <div class="form-group"><label>الإصدار</label><input id="appVersion"></div>
                <div class="form-group"><label>الحجم</label><input id="appSize"></div>
                <div class="form-group"><label>المطور</label><input id="appDeveloper"></div>
                <div class="form-group"><label>رابط الأيقونة</label><input id="appIconUrl"></div>
                <div class="form-group"><label>ملف التطبيق</label><input type="file" id="appFile"><br>
                <button class="btn btn-sm" onclick="uploadToGitHub()">📤 رفع إلى GitHub</button>
                <div id="uploadProgress" style="margin-top:8px;"></div>
                <input type="hidden" id="appDownloadUrl">
                </div>
                <div class="form-group"><label>وسوم</label><input id="appTags"></div>
                <button class="btn" onclick="saveApp()">حفظ</button>
            `;
        }

        async function uploadToGitHub() {
            if (!githubToken || !githubRepo) {
                showDebug('خطأ', 'لم يتم إعداد GitHub. اذهب إلى إعدادات GitHub أولاً.');
                return;
            }
            const fileInput = document.getElementById('appFile');
            if (!fileInput.files.length) { showDebug('⚠️', 'اختر ملفاً أولاً'); return; }
            const file = fileInput.files[0];
            const progressDiv = document.getElementById('uploadProgress');
            progressDiv.innerHTML = '<div class="progress-container"><div class="progress-bar" id="progressBar" style="width:0%"></div></div><div id="progressText">0%</div>';
            const progressBar = document.getElementById('progressBar');
            const progressText = document.getElementById('progressText');
            const downloadUrlInput = document.getElementById('appDownloadUrl');

            try {
                // 1. جلب أو إنشاء إصدارة
                progressText.textContent = '⏳ تجهيز الإصدارة...';
                const releasesUrl = `https://api.github.com/repos/${githubRepo}/releases?per_page=1`;
                let resp = await fetch(releasesUrl, { headers: { Authorization: `token ${githubToken}` } });
                let releaseId;
                if (resp.ok) {
                    const releases = await resp.json();
                    if (releases.length > 0) releaseId = releases[0].id;
                }
                if (!releaseId) {
                    // إنشاء إصدارة
                    const createUrl = `https://api.github.com/repos/${githubRepo}/releases`;
                    resp = await fetch(createUrl, {
                        method: 'POST',
                        headers: { Authorization: `token ${githubToken}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            tag_name: 'v1.' + Date.now(),
                            name: 'تطبيقات',
                            body: 'ملفات التطبيقات',
                            draft: false,
                            prerelease: false
                        })
                    });
                    if (!resp.ok) {
                        const err = await resp.json();
                        throw new Error('فشل إنشاء الإصدارة: ' + (err.message || JSON.stringify(err)));
                    }
                    const data = await resp.json();
                    releaseId = data.id;
                }

                // 2. رفع الملف
                progressText.textContent = '0%';
                const uploadUrl = `https://uploads.github.com/repos/${githubRepo}/releases/${releaseId}/assets?name=${encodeURIComponent(file.name)}`;
                const xhr = new XMLHttpRequest();
                xhr.open('POST', uploadUrl);
                xhr.setRequestHeader('Authorization', `token ${githubToken}`);
                xhr.setRequestHeader('Content-Type', 'application/octet-stream');
                xhr.upload.onprogress = (e) => {
                    if (e.lengthComputable) {
                        const pct = Math.round(e.loaded/e.total*100);
                        progressBar.style.width = pct+'%';
                        progressText.textContent = pct+'%';
                    }
                };
                xhr.onload = () => {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const asset = JSON.parse(xhr.responseText);
                        downloadUrlInput.value = asset.browser_download_url;
                        progressText.textContent = '✅ تم الرفع';
                        showToast('✅ رفع ناجح');
                    } else {
                        let msg = 'فشل الرفع';
                        try { const e = JSON.parse(xhr.responseText); msg = e.message || msg; } catch(e){}
                        progressText.textContent = '❌ '+msg;
                        showDebug('❌ خطأ في الرفع', msg);
                    }
                };
                xhr.onerror = () => { progressText.textContent = '❌ خطأ شبكة'; };
                xhr.send(file);
            } catch(e) {
                progressText.textContent = '❌ '+e.message;
                showDebug('❌ استثناء', e.message);
            }
        }

        async function saveApp() {
            const name = document.getElementById('appName').value.trim();
            const downloadUrl = document.getElementById('appDownloadUrl').value.trim();
            if(!name || !downloadUrl) return showToast('املأ الحقول المطلوبة','error');
            await db.collection('apps').add({
                name,
                nameEn: document.getElementById('appNameEn').value.trim(),
                shortDesc: document.getElementById('appShortDesc').value.trim(),
                fullDesc: document.getElementById('appFullDesc').value.trim(),
                version: document.getElementById('appVersion').value.trim(),
                size: document.getElementById('appSize').value.trim(),
                developer: document.getElementById('appDeveloper').value.trim(),
                iconUrl: document.getElementById('appIconUrl').value.trim(),
                downloadUrl,
                tags: document.getElementById('appTags').value.split(',').map(t=>t.trim()).filter(Boolean),
                downloads:0,
                createdAt: firebase.firestor
