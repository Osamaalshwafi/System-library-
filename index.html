    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --surface-alt: #f0f2f8;
            --text: #1a1d2e;
            --text-secondary: #5a5f78;
            --text-muted: #8b8fa8;
            --primary: #5b4cf0;
            --primary-light: #7c6ff7;
            --primary-dark: #4338ca;
            --primary-glow: rgba(91, 76, 240, 0.25);
            --accent: #f7931e;
            --accent-light: #ffb347;
            --green: #10b981;
            --green-light: #d1fae5;
            --red: #ef4444;
            --red-light: #fee2e2;
            --border: #e5e7f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --shadow: 0 4px 16px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.1), 0 8px 20px rgba(0,0,0,0.06);
            --shadow-xl: 0 32px 64px rgba(0,0,0,0.12), 0 12px 32px rgba(0,0,0,0.08);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --transition-fast: 0.18s cubic-bezier(0.4,0,0.2,1);
            --transition-slow: 0.5s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent; }
        body {
            font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.6;
            min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
        }

        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#d1d5e0; border-radius:20px; }
        ::-webkit-scrollbar-thumb:hover { background:#b0b7c9; }

        .particles-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .particle { position:absolute; border-radius:50%; animation:floatUp linear infinite; opacity:0; }
        @keyframes floatUp {
            0% { transform:translateY(105vh) scale(0); opacity:0; }
            10% { opacity:1; }
            90% { opacity:0.5; }
            100% { transform:translateY(-10vh) scale(1.2); opacity:0; }
        }

        .header {
            position:sticky; top:0; z-index:100; background:rgba(255,255,255,0.78);
            backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border); transition:var(--transition); padding:0 20px;
        }
        .header.scrolled { box-shadow:var(--shadow); background:rgba(255,255,255,0.92); }
        .nav { max-width:1300px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
        .logo {
            display:flex; align-items:center; gap:10px; font-size:1.35rem; font-weight:800; color:var(--primary);
            text-decoration:none; letter-spacing:-0.5px; white-space:nowrap; transition:var(--transition-fast);
        }
        .logo:hover { transform:scale(1.03); }
        .logo-icon {
            width:42px; height:42px; background:linear-gradient(135deg,var(--primary),var(--primary-light));
            border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;
            font-size:1.5rem; color:#fff; box-shadow:0 4px 14px var(--primary-glow); animation:logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%,100% { box-shadow:0 4px 14px var(--primary-glow); }
            50% { box-shadow:0 6px 24px rgba(91,76,240,0.4); }
        }
        .nav-actions { display:flex; align-items:center; gap:10px; }
        .btn {
            padding:10px 20px; border-radius:50px; font-weight:600; font-size:0.9rem; cursor:pointer; border:none;
            transition:var(--transition-fast); text-decoration:none; display:inline-flex; align-items:center;
            gap:7px; font-family:var(--font); white-space:nowrap; letter-spacing:0.2px;
        }
        .btn-primary {
            background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff;
            box-shadow:0 4px 14px var(--primary-glow);
        }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(91,76,240,0.35); }
        .btn-outline { background:transparent; color:var(--primary); border:2px solid var(--primary); }
        .btn-outline:hover { background:var(--primary); color:#fff; transform:translateY(-2px); }
        .btn-ghost { background:transparent; color:var(--text-secondary); padding:8px 14px; }
        .btn-ghost:hover { background:var(--surface-alt); color:var(--text); }
        .btn-sm { padding:7px 14px; font-size:0.8rem; border-radius:40px; }
        .btn-danger { background:var(--red); color:#fff; }
        .btn-danger:hover { background:#dc2626; }
        .btn-xs { padding:6px 12px; font-size:0.75rem; border-radius:30px; }

        .main-content { position:relative; z-index:1; max-width:1300px; margin:0 auto; padding:20px 20px 60px; }

        .hero { text-align:center; padding:50px 20px 40px; animation:fadeInUp 0.7s ease-out; }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }
        .hero-badge {
            display:inline-block; padding:8px 18px; background:var(--primary-glow); color:var(--primary);
            border-radius:50px; font-weight:700; font-size:0.85rem; margin-bottom:16px;
            animation:badgeGlow 2.5s ease-in-out infinite;
        }
        @keyframes badgeGlow {
            0%,100% { box-shadow:0 0 0 0 rgba(91,76,240,0.3); }
            50% { box-shadow:0 0 0 14px rgba(91,76,240,0); }
        }
        .hero h1 {
            font-size:clamp(2rem,5vw,3.2rem); font-weight:900; line-height:1.25; margin-bottom:12px;
            background:linear-gradient(135deg,var(--text) 30%,var(--primary-dark));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .hero-subtitle { font-size:1.1rem; color:var(--text-secondary); max-width:600px; margin:0 auto 24px; line-height:1.7; }
        .hero-stats { display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:10px; }
        .hero-stat { text-align:center; animation:fadeInUp 0.7s ease-out backwards; }
        .hero-stat:nth-child(2) { animation-delay:0.1s; }
        .hero-stat:nth-child(3) { animation-delay:0.2s; }
        .hero-stat-value { font-size:2rem; font-weight:900; color:var(--primary); }
        .hero-stat-label { font-size:0.85rem; color:var(--text-muted); }

        .search-filter-section { margin:20px 0 30px; animation:fadeInUp 0.6s ease-out 0.2s backwards; }
        .search-wrapper {
            display:flex; align-items:center; background:var(--surface); border-radius:60px;
            padding:6px 6px 6px 22px; box-shadow:var(--shadow); border:2px solid transparent;
            transition:var(--transition); max-width:650px; margin:0 auto 20px;
        }
        .search-wrapper:focus-within {
            border-color:var(--primary); box-shadow:var(--shadow-lg), 0 0 0 8px var(--primary-glow);
        }
        .search-wrapper input {
            flex:1; border:none; outline:none; font-size:1rem; padding:12px 6px; background:transparent;
            font-family:var(--font); color:var(--text);
        }
        .search-wrapper input::placeholder { color:var(--text-muted); }
        .search-btn {
            background:var(--primary); color:#fff; border:none; border-radius:50px; padding:12px 24px;
            cursor:pointer; font-weight:700; font-size:0.9rem; transition:var(--transition-fast);
            font-family:var(--font); white-space:nowrap;
        }
        .search-btn:hover { background:var(--primary-dark); transform:scale(1.03); }
        .category-tabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:0; }
        .cat-tab {
            padding:10px 20px; border-radius:50px; border:2px solid var(--border); background:var(--surface);
            cursor:pointer; font-weight:600; font-size:0.88rem; transition:var(--transition-fast);
            font-family:var(--font); color:var(--text-secondary); white-space:nowrap;
        }
        .cat-tab:hover { border-color:var(--primary-light); color:var(--primary); transform:translateY(-1px); }
        .cat-tab.active {
            background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 4px 14px var(--primary-glow);
        }
        .results-info { text-align:center; margin:10px 0; color:var(--text-muted); font-size:0.9rem; }

        .apps-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; }
        .app-card {
            background:var(--surface); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-sm);
            cursor:pointer; transition:var(--transition); border:2px solid transparent; position:relative;
            overflow:hidden; animation:fadeInUp 0.5s ease-out backwards; display:flex; flex-direction:column; gap:12px;
        }
        .app-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-xl); border-color:var(--primary-light); }
        .app-card:active { transform:scale(0.98); }
        .app-card::after {
            content:''; position:absolute; top:-50%; right:-50%; width:100%; height:100%;
            background:radial-gradient(circle, var(--primary-glow) 0%, transparent 70%); opacity:0;
            transition:var(--transition-slow); pointer-events:none;
        }
        .app-card:hover::after { opacity:1; }
        .app-card-header { display:flex; align-items:center; gap:14px; }
        .app-icon {
            width:56px; height:56px; border-radius:var(--radius-sm); object-fit:cover;
            background:var(--surface-alt); flex-shrink:0; box-shadow:var(--shadow-sm); transition:var(--transition);
        }
        .app-card:hover .app-icon { transform:scale(1.06); box-shadow:var(--shadow); }
        .app-icon-placeholder {
            width:56px; height:56px; border-radius:var(--radius-sm);
            background:linear-gradient(135deg,var(--primary),var(--primary-light));
            display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#fff; flex-shrink:0;
        }
        .app-card-info { flex:1; min-width:0; }
        .app-card-name {
            font-weight:800; font-size:1.05rem; color:var(--text); line-height:1.3;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
        }
        .app-card-category { font-size:0.78rem; color:var(--primary); font-weight:600; margin-top:2px; }
        .app-card-desc {
            font-size:0.88rem; color:var(--text-secondary); line-height:1.5;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex:1;
        }
        .app-card-meta { display:flex; gap:14px; font-size:0.78rem; color:var(--text-muted); align-items:center; flex-wrap:wrap; }
        .app-card-meta span { display:flex; align-items:center; gap:4px; }
        .app-card-badge {
            position:absolute; top:14px; left:14px; background:var(--accent); color:#fff;
            padding:5px 12px; border-radius:50px; font-size:0.72rem; font-weight:700; z-index:2;
        }

        .empty-state { text-align:center; padding:50px 20px; color:var(--text-muted); grid-column:1/-1; }
        .empty-state-icon { font-size:4rem; margin-bottom:16px; opacity:0.6; }
        .empty-state h3 { font-size:1.3rem; color:var(--text); margin-bottom:8px; }
        .skeleton {
            background:linear-gradient(90deg,#e8eaf0 25%,#f0f2f8 50%,#e8eaf0 75%);
            background-size:200% 100%; animation:shimmer 1.6s ease-in-out infinite; border-radius:8px;
        }
        @keyframes shimmer {
            0% { background-position:200% 0; }
            100% { background-position:-200% 0; }
        }
        .skeleton-card { height:200px; border-radius:var(--radius-lg); }

        .modal-overlay {
            position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.55);
            backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
            display:flex; align-items:center; justify-content:center; padding:20px; animation:fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .modal {
            background:var(--surface); border-radius:var(--radius-xl); max-width:620px; width:100%; max-height:85vh;
            overflow-y:auto; box-shadow:var(--shadow-xl); animation:modalIn 0.35s cubic-bezier(0.4,0,0.2,1); position:relative;
        }
        @keyframes modalIn {
            from { opacity:0; transform:translateY(40px) scale(0.94); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        .modal-close {
            position:sticky; top:12px; float:left; z-index:10; width:40px; height:40px; border-radius:50%;
            background:var(--surface-alt); border:none; cursor:pointer; font-size:1.3rem;
            display:flex; align-items:center; justify-content:center; transition:var(--transition-fast);
            color:var(--text); margin:8px 8px 0 0;
        }
        .modal-close:hover { background:#e8eaf0; transform:rotate(90deg); }
        .modal-body { padding:8px 28px 28px; }
        .modal-icon { width:80px; height:80px; border-radius:var(--radius); object-fit:cover; margin-bottom:16px; box-shadow:var(--shadow); }
        .modal-icon-placeholder {
            width:80px; height:80px; border-radius:var(--radius); background:linear-gradient(135deg,var(--primary),var(--primary-light));
            display:flex; align-items:center; justify-content:center; font-size:2.2rem; color:#fff; margin-bottom:16px;
        }
        .modal h2 { font-size:1.6rem; font-weight:900; margin-bottom:6px; }
        .modal .modal-category {
            display:inline-block; padding:5px 14px; background:var(--primary-glow); color:var(--primary);
            border-radius:50px; font-weight:700; font-size:0.8rem; margin-bottom:14px;
        }
        .modal-desc { color:var(--text-secondary); line-height:1.8; margin-bottom:16px; white-space:pre-line; }
        .modal-meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
        .modal-meta-item { background:var(--surface-alt); padding:12px 16px; border-radius:var(--radius-sm); font-size:0.85rem; }
        .modal-meta-item strong { display:block; color:var(--text); font-weight:700; }
        .modal-meta-item span { color:var(--text-muted); font-size:0.8rem; }
        .btn-download {
            display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px;
            background:linear-gradient(135deg,var(--green),#059669); color:#fff; border:none; border-radius:60px;
            font-size:1.1rem; font-weight:800; cursor:pointer; transition:var(--transition); font-family:var(--font);
            letter-spacing:0.3px; box-shadow:0 6px 22px rgba(16,185,129,0.3);
        }
        .btn-download:hover { transform:translateY(-3px); box-shadow:0 12px 32px rgba(16,185,129,0.4); }
        .btn-download:active { transform:scale(0.96); }
        .download-icon { font-size:1.4rem; animation:bounceDown 1.8s ease-in-out infinite; }
        @keyframes bounceDown {
            0%,100% { transform:translateY(0); }
            30% { transform:translateY(6px); }
            50% { transform:translateY(0); }
            70% { transform:translateY(3px); }
        }

        .admin-overlay {
            position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.6);
            backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
            display:flex; align-items:center; justify-content:center; padding:20px;
        }
        .admin-panel {
            background:var(--surface); border-radius:var(--radius-xl); max-width:700px; width:100%; max-height:90vh;
            overflow-y:auto; box-shadow:var(--shadow-xl); padding:28px; animation:modalIn 0.35s;
        }
        .admin-panel h2 { font-size:1.5rem; font-weight:900; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-weight:700; margin-bottom:5px; font-size:0.9rem; color:var(--text); }
        .form-group input, .form-group textarea, .form-group select {
            width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:var(--radius-sm);
            font-family:var(--font); font-size:0.95rem; transition:var(--transition-fast);
            background:var(--surface-alt); color:var(--text); resize:vertical;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline:none; border-color:var(--primary); box-shadow:0 0 0 6px var(--primary-glow); background:#fff;
        }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:500px) { .form-row { grid-template-columns:1fr; } }
        .admin-app-list-item {
            display:flex; align-items:center; justify-content:space-between; padding:12px 16px;
            background:var(--surface-alt); border-radius:var(--radius-sm); margin-bottom:8px; gap:10px; flex-wrap:wrap;
        }
        .admin-app-list-item span { font-weight:600; flex:1; min-width:120px; }
        .admin-app-list-item .actions { display:flex; gap:6px; }

        .toast-container {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:999;
            display:flex; flex-direction:column; gap:8px; pointer-events:none;
        }
        .toast {
            padding:14px 22px; border-radius:50px; color:#fff; font-weight:700; font-size:0.9rem;
            animation:toastIn 0.4s cubic-bezier(0.4,0,0.2,1); pointer-events:auto; box-shadow:var(--shadow-lg);
            text-align:center; white-space:nowrap;
        }
        .toast.success { background:#10b981; }
        .toast.error { background:#ef4444; }
        .toast.info { background:var(--primary); }
        @keyframes toastIn {
            from { opacity:0; transform:translateY(30px) scale(0.9); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity:1; transform:translateY(0) scale(1); }
            to { opacity:0; transform:translateY(-20px) scale(0.8); }
        }

        /* Progress bar */
        .progress-container { margin-top:8px; background:var(--surface-alt); border-radius:50px; height:12px; overflow:hidden; }
        .progress-bar { height:100%; width:0%; background:var(--primary); border-radius:50px; transition: width 0.3s; }
        .progress-text { font-size:0.8rem; color:var(--text-muted); margin-top:4px; }

        .debug-box { background: #1e1e2f; color: #a0ffa0; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; margin-top: 10px; max-height: 120px; overflow-y: auto; }

        .footer { text-align:center; padding:30px 20px; color:var(--text-muted); font-size:0.85rem; position:relative; z-index:1; }
        .footer a { color:var(--primary); text-decoration:none; font-weight:600; }

        .hidden { display:none !important; }

        @media (max-width:768px) {
            .apps-grid { grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
            .hero h1 { font-size:1.8rem; }
            .hero-subtitle { font-size:0.95rem; }
            .nav { height:56px; }
            .logo { font-size:1.1rem; }
            .logo-icon { width:34px; height:34px; font-size:1.2rem; }
            .btn { padding:8px 14px; font-size:0.78rem; }
            .cat-tab { padding:8px 14px; font-size:0.78rem; }
            .modal { max-width:95vw; border-radius:var(--radius-lg); }
            .modal-body { padding:8px 18px 20px; }
            .admin-panel { padding:18px; max-width:95vw; }
            .hero-stats { gap:16px; }
            .hero-stat-value { font-size:1.5rem; }
        }
        @media (max-width:400px) {
            .apps-grid { grid-template-columns:1fr; }
            .app-card { padding:16px; }
            .search-wrapper { padding:4px 4px 4px 14px; border-radius:40px; }
            .search-wrapper input { font-size:0.9rem; padding:10px 4px; }
            .search-btn { padding:10px 16px; font-size:0.8rem; }
        }
    </style>
</head>
<body>

    <div class="particles-container" id="particlesContainer" aria-hidden="true"></div>

    <header class="header" id="header">
        <nav class="nav">

                <button class="cat-tab" data-category="games" role="tab" aria-selected="false">🎮 ألعاب</button>
                <button class="cat-tab" data-category="tools" role="tab" aria-selected="false">🛠️ أدوات</button>

    <script>
        // ==================== FIREBASE CONFIGURATION ====================
        firebase.initializeApp({
            apiKey: "AIzaSyDvDaK7HtwtQ_VmR9cKoDq6sdrUyL_Hfls",
            authDomain: "system-library-52cc1.firebaseapp.com",
            projectId: "system-library-52cc1",
            storageBucket: "system-library-52cc1.firebasestorage.app",
            messagingSenderId: "139702257477",
            appId: "1:139702257477:web:1615f6c263afb3e1d1e02c"
        });
        const db = firebase.firestore();

        const ADMIN_PASSWORD = 'admin2025digital';
        let allApps = [], currentCategory = 'all', searchQuery = '', isAdminLoggedIn = false, editingAppId = null;

        // GitHub settings
        let githubToken = localStorage.getItem('github_token') || '';
        let githubRepo = localStorage.getItem('github_repo') || '';
        let githubBranch = localStorage.getItem('github_branch') || 'main';

        // DOM
        const $ = id => document.getElementById(id);
        const appsGrid = $('appsGrid'), searchInput = $('searchInput'), categoryTabs = $('categoryTabs'),
              resultsInfo = $('resultsInfo'), appModalOverlay = $('appModalOverlay'), modalBody = $('modalBody'),
              adminOverlay = $('adminOverlay'), adminContent = $('adminContent'), toastContainer = $('toastContainer'),
              statAppsCount = $('statAppsCount'), statDownloads = $('statDownloads'),
              particlesContainer = $('particlesContainer'), header = $('header');

        // Particles
        function createParticles() {
            const colors = ['#5b4cf0','#7c6ff7','#f7931e','#10b981','#06b6d4','#8b5cf6'];
            for (let i=0; i<35; i++) {
                const p = document.createElement('div'); p.className = 'particle';
                const size = Math.random()*8+3;
                p.style.width = size+'px'; p.style.height = size+'px';
                p.style.left = Math.random()*100+'%';
                p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                p.style.animationDuration = Math.random()*14+8+'s';
                p.style.animationDelay = Math.random()*12+'s';
                particlesContainer.appendChild(p);
            }
        }

        function showToast(msg, type='info') {
            const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(()=>{ t.style.animation = 'toastOut 0.4s ease-in forwards'; t.addEventListener('animationend',()=>t.remove()); },3000);
        }

        function showDebug(title, text) {
            const container = document.getElementById('debugContainer');
            if (container) {
                container.innerHTML = `<strong>${title}:</strong><div class="debug-box">${text}</div>`;
            }
        }

        // Firestore
        async function fetchApps() {
            if (!db) return [];
            try {
                const snap = await db.collection('apps').orderBy('createdAt','desc').get();
                const apps = []; snap.forEach(d => apps.push({id:d.id,...d.data()})); return apps;
            } catch(e) { showToast('⚠️ خطأ في الاتصال بقاعدة البيانات','error'); return []; }
        }
        async function addApp(data) {
            await db.collection('apps').add({...data, downloads:0, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
        }
        async function updateApp(id, data) { await db.collection('apps').doc(id).update(data); }
        async function deleteApp(id) { await db.collection('apps').doc(id).delete(); }
        async function incrementDownload(id) {
            await db.collection('apps').doc(id).update({downloads:firebase.firestore.FieldValue.increment(1)});
        }

        // Filter & Render
        function getFilteredApps() {
            let filtered = [...allApps];
            if (currentCategory !== 'all') filtered = filtered.filter(a => a.category === currentCategory);
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(a => [a.name,a.nameEn,a.shortDesc,a.fullDesc,a.developer,...(a.tags||[])].join(' ').toLowerCase().includes(q));
            }
            return filtered;
        }

        function renderApps() {
            const filtered = getFilteredApps();
            resultsInfo.textContent = filtered.length ? `🔍 تم العثور على ${filtered.length} تطبيق` : '😕 لا توجد تطبيقات تطابق بحثك';
            if (!filtered.length && allApps.length && db) {
                appsGrid.innerHTML = Array(6).fill('<div class="skeleton skeleton-card"></div>').join('');
                return;
            }
            if (!filtered.length) {
                appsGrid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><h3>لا توجد تطبيقات حالياً</h3><p>جرب كلمة بحث مختلفة أو تصفح جميع الفئات.</p></div>`;
                return;
            }
            const catLabels = {mobile:'📱 تطبيق هاتف',desktop:'💻 تطبيق حاسوب',games:'🎮 لعبة',tools:'🛠️ أداة',education:'📚 تعليم'};
            appsGrid.innerHTML = filtered.map((app,i) => {
                const iconHtml = app.iconUrl
                    ? `<img src="${app.iconUrl}" alt="${app.name}" class="app-icon" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="app-icon-placeholder" style="display:none;">${(app.name||'ت')[0]}</div>`
                    : `<div class="app-icon-placeholder">${(app.name||'ت')[0]}</div>`;
                const cat = catLabels[app.category] || app.category;
                return `<article class="app-card" style="animation-delay:${i*0.06}s" onclick="openAppDetail('${app.id}')" role="button" tabindex="0">
                    ${app.featured?'<span class="app-card-badge">⭐ مميز</span>':''}
                    <div class="app-card-header">${iconHtml}<div class="app-card-info"><h3 class="app-card-name">${app.name||'تطبيق'}</h3><div class="app-card-category">${cat}</div></div></div>
                    <p class="app-card-desc">${app.shortDesc||'لا يوجد وصف'}</p>
                    <div class="app-card-meta">${app.size?`<span>📦 ${app.size}</span>`:''}${app.version?`<span>🏷️ ${app.version}</span>`:''}<span>⬇️ ${app.downloads||0}</span></div>
                </article>`;
            }).join('');
            statAppsCount.textContent = allApps.length;
            statDownloads.textContent = allApps.reduce((s,a)=>s+(a.downloads||0),0).toLocaleString('ar-EG');
        }

        // Modal
        function openAppDetail(id) {
            const app = allApps.find(a=>a.id===id); if(!app) return;
            const catLabels = {mobile:'📱 تطبيق هاتف',desktop:'💻 تطبيق حاسوب',games:'🎮 لعبة',tools:'🛠️ أداة',education:'📚 تعليم'};
            const cat = catLabels[app.category] || app.category;
            const iconHtml = app.iconUrl
                ? `<img src="${app.iconUrl}" class="modal-icon" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="modal-icon-placeholder" style="display:none;">${(app.name||'ت')[0]}</div>`
                : `<div class="modal-icon-placeholder">${(app.name||'ت')[0]}</div>`;
            modalBody.innerHTML = `
                ${iconHtml}
                <h2 id="modalTitle">${app.name||'تطبيق'}</h2>
                <span class="modal-category">${cat}</span>
                <p class="modal-desc">${app.fullDesc||app.shortDesc||'لا يوجد وصف مفصل.'}</p>
                <div class="modal-meta-grid">
                    ${app.version?`<div class="modal-meta-item"><strong>الإصدار</strong><span>${app.version}</span></div>`:''}
                    ${app.size?`<div class="modal-meta-item"><strong>الحجم</strong><span>${app.size}</span></div>`:''}
                    ${app.developer?`<div class="modal-meta-item"><strong>المطور</strong><span>${app.developer}</span></div>`:''}
                    ${app.requirements?`<div class="modal-meta-item"><strong>المتطلبات</strong><span>${app.requirements}</span></div>`:''}
                    <div class="modal-meta-item"><strong>التحميلات</strong><span>⬇️ ${(app.downloads||0).toLocaleString('ar-EG')}</span></div>
                </div>
                <a href="${app.downloadUrl}" class="btn-download" onclick="handleDownloadClick(event, '${app.id}', '${app.downloadUrl}')">
                    <span class="download-icon">⬇️</span> تحميل الآن
                </a>
            `;
            appModalOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }
        function closeModal() { appModalOverlay.classList.add('hidden'); document.body.style.overflow = ''; }

        async function handleDownloadClick(e, appId, url) {
            e.preventDefault();
            await incrementDownload(appId);
            const app = allApps.find(a=>a.id===appId);
            if(app) app.downloads = (app.downloads||0)+1;
            statDownloads.textContent = allApps.reduce((s,a)=>s+(a.downloads||0),0).toLocaleString('ar-EG');
            showToast('✅ جاري التحميل...','success');
            setTimeout(()=>{ closeModal(); renderApps(); }, 800);
            const a = document.createElement('a');
            a.href = url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }

        // Search
        function performSearch() { searchQuery = searchInput.value; renderApps(); }
        searchInput.addEventListener('input', ()=>{
            clearTimeout(searchInput._t);
            searchInput._t = setTimeout(()=>{ searchQuery=searchInput.value; renderApps(); },350);
        });
        categoryTabs.addEventListener('click', e=>{
            const tab = e.target.closest('.cat-tab'); if(!tab) return;
            currentCategory = tab.dataset.category;
            categoryTabs.querySelectorAll('.cat-tab').forEach(t=>{ t.classList.remove('active'); t.setAttribute('aria-selected','false'); });
            tab.classList.add('active'); tab.setAttribute('aria-selected','true');
            renderApps();
        });

        // Admin
        function openAdminPanel() {
            if(!isAdminLoggedIn) showLogin(); else showDashboard();
            adminOverlay.classList.remove('hidden'); document.body.style.overflow = 'hidden';
        }
        function closeAdminPanel() { adminOverlay.classList.add('hidden'); document.body.style.overflow = ''; }
        function showLogin() {
            adminContent.innerHTML = `
                <h2 id="adminTitle">🔐 دخول لوحة التحكم</h2>
                <p>أدخل كلمة المرور</p>
                <div class="form-group"><input type="password" id="adminPassword" placeholder="كلمة المرور"></div>
                <button class="btn btn-primary" onclick="adminLogin()" style="width:100%">دخول</button>
            `;
        }
        function adminLogin() {
            if(document.getElementById('adminPassword').value === ADMIN_PASSWORD) { isAdminLoggedIn=true; showToast('✅ تم الدخول','success'); showDashboard(); }
            else showToast('❌ خطأ','error');
        }
        function showDashboard() {
            adminContent.innerHTML = `
                <h2>⚙️ لوحة التحكم</h2>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
                    <button class="btn btn-primary btn-sm" onclick="showAddForm()">➕ إضافة تطبيق</button>
                    <button class="btn btn-outline btn-sm" onclick="refreshApps()">🔄 تحديث</button>
                    <button class="btn btn-outline btn-sm" onclick="showGitHubSettings()">🔑 إعدادات GitHub</button>
                    <button class="btn btn-ghost btn-sm" onclick="isAdminLoggedIn=false;showLogin();">🚪 خروج</button>
                </div>
                <div id="adminAppList"></div>
                <div id="adminFormContainer"></div>
            `;
            renderAdminAppList();
        }
        function renderAdminAppList() {
            const list = document.getElementById('adminAppList'); if(!list) return;
            if(!allApps.length) { list.innerHTML = '<p style="text-align:center;">لا توجد تطبيقات</p>'; return; }
            list.innerHTML = allApps.map(a => `
                <div class="admin-app-list-item">
                    <span>${a.iconUrl?`<img src="${a.iconUrl}" style="width:28px;height:28px;border-radius:6px;vertical-align:middle;margin-left:6px;">`:''}<strong>${a.name}</strong> · ${a.category||'عام'}</span>
                    <div class="actions">
                        <button class="btn btn-outline btn-xs" onclick="editApp('${a.id}')">✏️</button>
                        <button class="btn btn-danger btn-xs" onclick="deleteAppConfirmed('${a.id}')">🗑️</button>
                    </div>
                </div>`).join('');
        }

        function showGitHubSettings() {
            document.getElementById('adminFormContainer').innerHTML = `
                <h3>إعدادات GitHub</h3>
                <div class="form-group">
                    <label>رمز الوصول (Personal Access Token)</label>
                    <input type="password" id="ghToken" value="${githubToken}" placeholder="github_pat_...">
                </div>
                <div class="form-group">
                    <label>اسم المستودع (username/repo)</label>
                    <input type="text" id="ghRepo" value="${githubRepo}" placeholder="مثال: ahmed/my-apps">
                </div>
                <div class="form-group">
                    <label>الفرع (branch)</label>
                    <input type="text" id="ghBranch" value="${githubBranch}" placeholder="main">
                </div>
                <div style="display:flex;gap:10px;margin-top:12px;">
                    <button class="btn btn-sm" onclick="verifyConnection()">📡 تحقق من الاتصال</button>
                    <button class="btn btn-primary btn-sm" onclick="saveGitHubSettings()">💾 حفظ الإعدادات</button>
                </div>
                <div id="debugContainer" style="margin-top:12px;"></div>
            `;
        }

        async function verifyConnection() {
            const token = document.getElementById('ghToken').value.trim();
            let repo = document.getElementById('ghRepo').value.trim();
            if (!token || !repo) { showDebug('خطأ', 'أدخل الرمز واسم المستودع'); return; }
            repo = repo.replace(/\s/g, '');
            if (!repo.includes('/')) { showDebug('خطأ', 'اسم المستودع يجب أن يكون owner/repo'); return; }
            showDebug('⏳', 'جاري التحقق...');
            try {
                const res = await fetch(`https://api.github.com/repos/${repo}`, {
                    headers: { Authorization: `token ${token}` }
                });
                const data = await res.json();
                if (res.ok) {
                    showDebug('✅ نجاح', `تم الاتصال بالمستودع: ${data.full_name}`);
                } else {
                    showDebug('❌ فشل', `حالة HTTP: ${res.status}\nالرسالة: ${data.message || 'غير معروف'}\nتأكد من صلاحيات الرمز واسم المستودع.`);
                }
            } catch (e) {
                showDebug('❌ خطأ شبكة', e.message);
            }
        }

        function saveGitHubSettings() {
            githubToken = document.getElementById('ghToken').value.trim();
            githubRepo = document.getElementById('ghRepo').value.trim().replace(/\s/g, '');
            githubBranch = document.getElementById('ghBranch').value.trim() || 'main';
            localStorage.setItem('github_token', githubToken);
            localStorage.setItem('github_repo', githubRepo);
            localStorage.setItem('github_branch', githubBranch);
            showToast('✅ تم الحفظ', 'success');
            showDashboard();
        }

        function showAddForm() { editingAppId=null; renderAppForm(); }
        function editApp(id) { editingAppId=id; const app = allApps.find(a=>a.id===id); renderAppForm(app); }

        function renderAppForm(app=null) {
            document.getElementById('adminFormContainer').innerHTML = `
                <hr><h3>${app?'✏️ تعديل التطبيق':'➕ إضافة تطبيق جديد'}</h3>
                <div class="form-group"><label>اسم التطبيق (بالعربية) *</label><input id="appName" value="${app?.name||''}" placeholder="واتساب بلس"></div>
                <div class="form-group"><label>اسم التطبيق (إنجليزي)</label><input id="appNameEn" value="${app?.nameEn||''}" placeholder="WhatsApp Plus"></div>
                <div class="form-row">
                    <div class="form-group"><label>الفئة</label><select id="appCategory">
                        <option value="mobile" ${app?.category==='mobile'?'selected':''}>📱 تطبيقات الهاتف</option>
                        <option value="desktop" ${app?.category==='desktop'?'selected':''}>💻 تطبيقات الحاسوب</option>
                        <option value="games" ${app?.category==='games'?'selected':''}>🎮 ألعاب</option>
                        <option value="tools" ${app?.category==='tools'?'selected':''}>🛠️ أدوات</option>
                        <option value="education" ${app?.category==='education'?'selected':''}>📚 تعليم</option>
                    </select></div>
                    <div class="form-group"><label>الإصدار</label><input id="appVersion" value="${app?.version||''}" placeholder="2.5.1"></div>
                </div>
                <div class="form-group"><label>وصف مختصر *</label><textarea id="appShortDesc" rows="2">${app?.shortDesc||''}</textarea></div>
                <div class="form-group"><label>وصف كامل</label><textarea id="appFullDesc" rows="4">${app?.fullDesc||''}</textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>الحجم</label><input id="appSize" value="${app?.size||''}" placeholder="45 MB"></div>
                    <div class="form-group"><label>المطور</label><input id="appDeveloper" value="${app?.developer||''}"></div>
                </div>
                <div class="form-group"><label>المتطلبات</label><input id="appRequirements" value="${app?.requirements||''}" placeholder="Android 8.0+"></div>
                <div class="form-group"><label>رابط الأيقونة</label><input id="appIconUrl" value="${app?.iconUrl||''}" placeholder="https://..."></div>
                <div class="form-group">
                    <label>ملف التطبيق (APK/EXE...)</label>
                    <input type="file" id="appFile" accept=".apk,.exe,.dmg,.zip,.rar,.ipa,.7z">
                    <button type="button" class="btn btn-outline btn-sm" onclick="uploadFileToGitHub()" style="margin-top:6px;">📤 رفع إلى GitHub</button>
                    <input type="hidden" id="appDownloadUrl" value="${app?.downloadUrl||''}">
                    <div id="uploadProgressContainer" style="margin-top:8px;">
                        ${app?.downloadUrl ? `<div>✅ الرابط الحالي: ${app.downloadUrl.substring(0,50)}...</div>` : ''}
                        <div class="progress-container" id="progressContainer" style="display:none;">
                            <div class="progress-bar" id="progressBar"></div>
                        </div>
                        <div class="progress-text" id="progressText"></div>
                    </div>
                </div>
                <div class="form-group"><label>وسوم (مفصولة بفواصل)</label><input id="appTags" value="${(app?.tags||[]).join(',')}" placeholder="تواصل,شات"></div>
                <div class="form-group"><label><input type="checkbox" id="appFeatured" ${app?.featured?'checked':''}> مميز</label></div>
                <div style="display:flex;gap:10px;">
                    <button class="btn btn-primary" onclick="saveApp()">💾 ${app?'تحديث':'حفظ'}</button>
                    <button class="btn btn-ghost" onclick="showDashboard()">إلغاء</button>
                </div>
            `;
        }

        // GitHub Upload with detailed error
        async function uploadFileToGitHub() {
    if (!githubToken || !githubRepo) {
        showToast('⚠️ أعد إعدادات GitHub أولاً', 'error');
        return;
    }
    const fileInput = document.getElementById('appFile');
    if (!fileInput.files.length) { showToast('⚠️ اختر ملفاً', 'error'); return; }
    const file = fileInput.files[0];

    // تنظيف اسم الملف: استبدال الفراغات والأحرف غير اللاتينية بشرطات سفلية
    let cleanName = file.name.replace(/\s+/g, '_');               // فراغات ← _
    cleanName = cleanName.replace(/[^\w.-]/g, '');               // إزالة أي شيء ليس حرف/رقم/نقطة/شرطة
    if (cleanName.length > 100) cleanName = cleanName.substring(0, 100); // تقصير الأسماء الطويلة جداً

    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const downloadUrlInput = document.getElementById('appDownloadUrl');

    progressContainer.style.display = 'block';
    progressBar.style.width = '0%';
    progressText.textContent = '0%';

    try {
        // 1. تجهيز الإصدارة
        progressText.textContent = '⏳ تجهيز الإصدارة...';
        let releaseId;
        // جلب أحدث إصدارة
        let resp = await fetch(`https://api.github.com/repos/${githubRepo}/releases?per_page=1`, {
            headers: { Authorization: `token ${githubToken}` }
        });
        if (resp.ok) {
            const releases = await resp.json();
            if (releases.length > 0) releaseId = releases[0].id;
        }
        if (!releaseId) {
            // إنشاء إصدارة جديدة
            resp = await fetch(`https://api.github.com/repos/${githubRepo}/releases`, {
                method: 'POST',
                headers: {
                    Authorization: `token ${githubToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    tag_name: 'v1.' + Date.now(),
                    name: 'تطبيقات',
                    body: 'ملفات التطبيقات',
                    draft: false,
                    prerelease: false
                })
            });
            if (!resp.ok) {
                const err = await resp.json();
                throw new Error('فشل إنشاء الإصدارة: ' + (err.message || JSON.stringify(err)));
            }
            const data = await resp.json();
            releaseId = data.id;
        }

        // 2. رفع الملف مع اسم نظيف
        progressText.textContent = '0%';
        const encodedName = encodeURIComponent(cleanName);
        const uploadUrl = `https://uploads.github.com/repos/${githubRepo}/releases/${releaseId}/assets?name=${encodedName}`;

        const xhr = new XMLHttpRequest();
        xhr.open('POST', uploadUrl);
        xhr.setRequestHeader('Authorization', `token ${githubToken}`);
        xhr.setRequestHeader('Content-Type', 'application/octet-stream');

        xhr.upload.addEventListener('progress', (e) => {
            if (e.lengthComputable) {
                const pct = Math.round(e.loaded / e.total * 100);
                progressBar.style.width = pct + '%';
                progressText.textContent = pct + '%';
            }
        });

        xhr.addEventListener('load', () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                const asset = JSON.parse(xhr.responseText);
                downloadUrlInput.value = asset.browser_download_url;
                progressText.textContent = '✅ تم الرفع';
                showToast('✅ رفع ناجح', 'success');
            } else {
                let msg = 'فشل الرفع';
                try {
                    const err = JSON.parse(xhr.responseText);
                    msg = err.message || msg;
                    // عرض الأخطاء التفصيلية إن وجدت
                    if (err.errors && err.errors.length > 0) {
                        msg += '\n' + err.errors.map(e => e.code + ': ' + (e.message || '')).join('\n');
                    }
                } catch(e) {}
                progressText.textContent = '❌ ' + msg;
                showDebug('❌ خطأ في الرفع', msg);
            }
            setTimeout(() => { progressContainer.style.display = 'none'; }, 2000);
        });

        xhr.addEventListener('error', () => {
            progressText.textContent = '❌ خطأ شبكة';
            showDebug('❌', 'فشل الاتصال بالخادم');
            progressContainer.style.display = 'none';
        });

        xhr.send(file);
    } catch (e) {
        progressText.textContent = '❌ ' + e.message;
        showDebug('❌ استثناء', e.message);
        progressContainer.style.display = 'none';
    }
}

        async function saveApp() {
            const name = document.getElementById('appName').value.trim();
            const shortDesc = document.getElementById('appShortDesc').value.trim();
            const downloadUrl = document.getElementById('appDownloadUrl').value.trim();
            if(!name || !shortDesc || !downloadUrl) { showToast('⚠️ أكمل الحقول المطلوبة','error'); return; }
            const data = {
                name,
                nameEn: document.getElementById('appNameEn').value.trim(),
                category: document.getElementById('appCategory').value,
                version: document.getElementById('appVersion').value.trim(),
                shortDesc,
                fullDesc: document.getElementById('appFullDesc').value.trim(),
                size: document.getElementById('appSize').value.trim(),
                developer: document.getElementById('appDeveloper').value.trim(),
                requirements: document.getElementById('appRequirements').value.trim(),
                iconUrl: document.getElementById('appIconUrl').value.trim(),
                downloadUrl,
                tags: document.getElementById('appTags').value.split(',').map(t=>t.trim()).filter(Boolean),
                featured: document.getElementById('appFeatured').checked
            };
            try {
                if(editingAppId) await updateApp(editingAppId, data);
                else await addApp(data);
                showToast('✅ تم الحفظ','success');
                editingAppId = null;
                showDashboard();
                refreshApps();
            } catch(e) { showToast('❌ خطأ في الحفظ','error'); }
        }

        async function deleteAppConfirmed(id) {
            if(!confirm('هل أنت متأكد من حذف هذا التطبيق؟')) return;
            await deleteApp(id);
            showToast('🗑️ تم الحذف','info');
            refreshApps();
            showDashboard();
        }

        async function refreshApps() {
            allApps = await fetchApps();
            renderApps();
            if(document.getElementById('adminAppList')) renderAdminAppList();
        }

        // Events
        appModalOverlay.addEventListener('click', e=>{ if(e.target===appModalOverlay) closeModal(); });
        adminOverlay.addEventListener('click', e=>{ if(e.target===adminOverlay) closeAdminPanel(); });
        document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeAdminPanel(); } });
        window.addEventListener('scroll', ()=> header.classList.toggle('scrolled', window.scrollY>50));

        // Start
        createParticles();
        refreshApps();
    </script>
