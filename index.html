            console.log('✅ Firebase initialized');
        } catch (e) {
            console.error('Firebase error:', e);
            db = null;
        }

        const ADMIN_PASSWORD = 'admin2025digital';
        let allApps = [], currentCategory = 'all', searchQuery = '', isAdminLoggedIn = false, editingAppId = null;

        // DOM refs
        const appsGrid = document.getElementById('appsGrid'), searchInput = document.getElementById('searchInput'),
              categoryTabs = document.getElementById('categoryTabs'), resultsInfo = document.getElementById('resultsInfo'),
              appModalOverlay = document.getElementById('appModalOverlay'), modalBody = document.getElementById('modalBody'),
              adminOverlay = document.getElementById('adminOverlay'), adminContent = document.getElementById('adminContent'),
              toastContainer = document.getElementById('toastContainer'), statAppsCount = document.getElementById('statAppsCount'),
              statDownloads = document.getElementById('statDownloads'), particlesContainer = document.getElementById('particlesContainer'),
              header = document.getElementById('header');

        function createParticles() {
            const colors = ['#5b4cf0','#7c6ff7','#f7931e','#10b981','#06b6d4','#8b5cf6'];
            for (let i=0;i<35;i++) {
                const p = document.createElement('div'); p.classList.add('particle');
                p.style.width = (Math.random()*8+3)+'px'; p.style.height = p.style.width;
                p.style.left = Math.random()*100+'%'; p.style.backgroundColor = colors[Math.floor(Math.random()*colors.length)];
                p.style.animationDuration = (Math.random()*14+8)+'s'; p.style.animationDelay = Math.random()*12+'s';
                particlesContainer.appendChild(p);
            }
        }

        function showToast(msg, type='info') {
            const t = document.createElement('div'); t.className = `toast ${type}`; t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(()=>{ t.style.animation = 'toastOut 0.4s ease-in forwards'; t.addEventListener('animationend',()=>t.remove()); },3000);
        }

        // Firestore operations
        async function fetchApps() {
            if(!db) return [];
            const snap = await db.collection('apps').orderBy('createdAt','desc').get();
            const apps = []; snap.forEach(d => apps.push({id:d.id,...d.data()})); return apps;
        }
        async function addAppToFirestore(data) {
            if(!db) throw new Error('No Firestore');
            const docRef = await db.collection('apps').add({...data, downloads:0, createdAt:firebase.firestore.FieldValue.serverTimestamp()});
            return docRef.id;
        }
        async function updateAppInFirestore(id, data) { await db.collection('apps').doc(id).update(data); }
        async function deleteAppFromFirestore(id) { await db.collection('apps').doc(id).delete(); }
        async function incrementDownload(id) {
            if(!db) return;
            await db.collection('apps').doc(id).update({downloads:firebase.firestore.FieldValue.increment(1)});
        }

        function getFilteredApps() {
            let filtered = [...allApps];
            if(currentCategory !== 'all') filtered = filtered.filter(a => a.category === currentCategory);
            if(searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(a => [a.name,a.nameEn,a.shortDesc,a.fullDesc,a.developer,...(a.tags||[])].join(' ').toLowerCase().includes(q));
            }
            return filtered;
        }

        function renderApps() {
            const filtered = getFilteredApps();
            resultsInfo.textContent = filtered.length ? `🔍 ${filtered.length} تطبيق` : '😕 لا توجد تطبيقات';
            if(!filtered.length && allApps.length && db) {
                appsGrid.innerHTML = Array(6).fill('<div class="skeleton skeleton-card"></div>').join(''); return;
            }
            if(!filtered.length) {
                appsGrid.innerHTML = `<div class="empty-state"><div class="empty-state-icon">📭</div><h3>لا توجد تطبيقات</h3></div>`; return;
            }
            appsGrid.innerHTML = filtered.map((app,i) => {
                const iconHtml = app.iconUrl ? `<img src="${app.iconUrl}" class="app-icon" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="app-icon-placeholder" style="display:none;">${(app.name||'ت')[0]}</div>` : `<div class="app-icon-placeholder">${(app.name||'ت')[0]}</div>`;
                const catLabels = {mobile:'📱 تطبيق هاتف',desktop:'💻 تطبيق حاسوب',games:'🎮 لعبة',tools:'🛠️ أداة',education:'📚 تعليم'};
                const cat = catLabels[app.category] || app.category;
                return `<article class="app-card" style="animation-delay:${i*0.06}s" onclick="openAppDetail('${app.id}')" tabindex="0">
                    ${app.featured?'<span class="app-card-badge">⭐ مميز</span>':''}
                    <div class="app-card-header">${iconHtml}<div class="app-card-info"><h3 class="app-card-name">${app.name||'تطبيق'}</h3><div class="app-card-category">${cat}</div></div></div>
                    <p class="app-card-desc">${app.shortDesc||''}</p>
                    <div class="app-card-meta">${app.size?`<span>📦 ${app.size}</span>`:''}${app.version?`<span>🏷️ ${app.version}</span>`:''}<span>⬇️ ${app.downloads||0}</span></div>
                </article>`;
            }).join('');
            statAppsCount.textContent = allApps.length;
            statDownloads.textContent = allApps.reduce((s,a)=>s+(a.downloads||0),0).toLocaleString('ar-EG');
        }

        function openAppDetail(id) {
            const app = allApps.find(a=>a.id===id); if(!app) return;
            const catLabels = {mobile:'📱 تطبيق هاتف',desktop:'💻 تطبيق حاسوب',games:'🎮 لعبة',tools:'🛠️ أداة',education:'📚 تعليم'};
            const cat = catLabels[app.category]||app.category;
            modalBody.innerHTML = `
                ${app.iconUrl?`<img src="${app.iconUrl}" class="modal-icon" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="modal-icon-placeholder" style="display:none;">${(app.name||'ت')[0]}</div>`:`<div class="modal-icon-placeholder">${(app.name||'ت')[0]}</div>`}
                <h2>${app.name||'تطبيق'}</h2><span class="modal-category">${cat}</span>
                <p class="modal-desc">${app.fullDesc||app.shortDesc||''}</p>
                <div class="modal-meta-grid">
                    ${app.version?`<div class="modal-meta-item"><strong>الإصدار</strong><span>${app.version}</span></div>`:''}
                    ${app.size?`<div class="modal-meta-item"><strong>الحجم</strong><span>${app.size}</span></div>`:''}
                    ${app.developer?`<div class="modal-meta-item"><strong>المطور</strong><span>${app.developer}</span></div>`:''}
                    ${app.requirements?`<div class="modal-meta-item"><strong>المتطلبات</strong><span>${app.requirements}</span></div>`:''}
                    <div class="modal-meta-item"><strong>التحميلات</strong><span>⬇️ ${(app.downloads||0).toLocaleString('ar-EG')}</span></div>
                </div>
                ${app.downloadUrl?`<a href="${app.downloadUrl}" target="_blank" class="btn-download" onclick="handleDownload('${app.id}')"><span class="download-icon">⬇️</span> تحميل الآن</a>`:'<p style="text-align:center;color:var(--text-muted);">⚠️ رابط التحميل غير متوفر</p>'}
            `;
            appModalOverlay.classList.remove('hidden'); document.body.style.overflow='hidden';
        }
        function closeModal() { appModalOverlay.classList.add('hidden'); document.body.style.overflow=''; }
        async function handleDownload(id) {
            await incrementDownload(id);
            const app = allApps.find(a=>a.id===id); if(app) app.downloads = (app.downloads||0)+1;
            statDownloads.textContent = allApps.reduce((s,a)=>s+(a.downloads||0),0).toLocaleString('ar-EG');
            showToast('✅ جاري التحميل...','success');
            setTimeout(()=>{ closeModal(); renderApps(); },800);
        }

        function performSearch() { searchQuery = searchInput.value; renderApps(); }
        searchInput.addEventListener('input', ()=>{
            clearTimeout(searchInput._debounce);
            searchInput._debounce = setTimeout(()=>{ searchQuery=searchInput.value; renderApps(); },350);
        });
        categoryTabs.addEventListener('click', e=>{
            const tab = e.target.closest('.cat-tab'); if(!tab) return;
            currentCategory = tab.dataset.category;
            categoryTabs.querySelectorAll('.cat-tab').forEach(t=>{t.classList.remove('active'); t.setAttribute('aria-selected','false');});
            tab.classList.add('active'); tab.setAttribute('aria-selected','true'); renderApps();
        });

        // Admin
        function openAdminPanel() {
            if(!isAdminLoggedIn) showAdminLogin(); else showAdminDashboard();
            adminOverlay.classList.remove('hidden'); document.body.style.overflow='hidden';
        }
        function closeAdminPanel() { adminOverlay.classList.add('hidden'); document.body.style.overflow=''; editingAppId=null; }
        function showAdminLogin() {
            adminContent.innerHTML = `<h2>🔐 دخول لوحة التحكم</h2><p>أدخل كلمة المرور</p>
                <div class="form-group"><input type="password" id="adminPassword" placeholder="كلمة المرور"></div>
                <button class="btn btn-primary" onclick="adminLogin()" style="width:100%">دخول</button>`;
        }
        function adminLogin() {
            if(document.getElementById('adminPassword').value === ADMIN_PASSWORD) { isAdminLoggedIn=true; showToast('✅ تم الدخول','success'); showAdminDashboard(); }
            else showToast('❌ خطأ','error');
        }
        function showAdminDashboard() {
            adminContent.innerHTML = `<h2>⚙️ إدارة التطبيقات</h2>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
                    <button class="btn btn-primary btn-sm" onclick="showAddAppForm()">➕ إضافة تطبيق</button>
                    <button class="btn btn-outline btn-sm" onclick="refreshApps()">🔄 تحديث</button>
                    <button class="btn btn-ghost btn-sm" onclick="isAdminLoggedIn=false;showAdminLogin();">🚪 خروج</button>
                </div>
                <div id="adminAppList"><p>جاري التحميل...</p></div>
                <div id="adminFormContainer"></div>`;
            renderAdminAppList();
        }
        function renderAdminAppList() {
            const c = document.getElementById('adminAppList'); if(!c) return;
            if(!allApps.length) { c.innerHTML = '<p style="text-align:center;">لا توجد تطبيقات</p>'; return; }
            c.innerHTML = allApps.map(a=>`<div class="admin-app-list-item">
                <span>${a.iconUrl?`<img src="${a.iconUrl}" style="width:28px;height:28px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-left:6px;">`:''} <strong>${a.name||'بدون'}</strong> · ${a.category}</span>
                <div class="actions">
                    <button class="btn btn-outline btn-xs" onclick="showEditAppForm('${a.id}')">✏️ تعديل</button>
                    <button class="btn btn-danger btn-xs" onclick="deleteApp('${a.id}')">🗑️ حذف</button>
                </div></div>`).join('');
        }
        function showAddAppForm() { editingAppId=null; document.getElementById('adminFormContainer').innerHTML = getAppFormHTML(); }
        function showEditAppForm(id) { editingAppId=id; const a = allApps.find(x=>x.id===id); if(a) document.getElementById('adminFormContainer').innerHTML = getAppFormHTML(a); }

        function getAppFormHTML(app=null) {
            const isEdit = !!app;
            return `<hr><h3>${isEdit?'✏️ تعديل':'➕ إضافة تطبيق'}</h3>
                <div class="form-group"><label>اسم التطبيق *</label><input type="text" id="appName" value="${app?.name||''}" required></div>
                <div class="form-group"><label>اسم إنجليزي</label><input type="text" id="appNameEn" value="${app?.nameEn||''}"></div>
                <div class="form-row">
                    <div class="form-group"><label>الفئة</label><select id="appCategory">
                        <option value="mobile" ${app?.category==='mobile'?'selected':''}>📱 هاتف</option>
                        <option value="desktop" ${app?.category==='desktop'?'selected':''}>💻 حاسوب</option>
                        <option value="games" ${app?.category==='games'?'selected':''}>🎮 ألعاب</option>
                        <option value="tools" ${app?.category==='tools'?'selected':''}>🛠️ أدوات</option>
                        <option value="education" ${app?.category==='education'?'selected':''}>📚 تعليم</option>
                    </select></div>
                    <div class="form-group"><label>الإصدار</label><input type="text" id="appVersion" value="${app?.version||''}"></div>
                </div>
                <div class="form-group"><label>وصف مختصر *</label><textarea id="appShortDesc" rows="2">${app?.shortDesc||''}</textarea></div>
                <div class="form-group"><label>وصف كامل</label><textarea id="appFullDesc" rows="4">${app?.fullDesc||''}</textarea></div>
                <div class="form-row">
                    <div class="form-group"><label>الحجم</label><input type="text" id="appSize" value="${app?.size||''}"></div>
                    <div class="form-group"><label>المطور</label><input type="text" id="appDeveloper" value="${app?.developer||''}"></div>
                </div>
                <div class="form-group"><label>المتطلبات</label><input type="text" id="appRequirements" value="${app?.requirements||''}"></div>
                <div class="form-group"><label>رابط الأيقونة</label><input type="url" id="appIconUrl" value="${app?.iconUrl||''}"></div>
                <div class="form-group">
                    <label>ملف التطبيق</label>
                    <button type="button" class="btn btn-outline btn-sm" onclick="openCloudinaryUploader()">📤 رفع ملف إلى Cloudinary</button>
                    <small style="display:block;margin-top:6px;color:var(--text-muted);">ارفع الملف ليتم تخزينه على Cloudinary ويعطيك رابط التحميل تلقائياً.</small>
                    <input type="hidden" id="appDownloadUrl" value="${app?.downloadUrl||''}">
                    <div id="uploadStatus" style="margin-top:8px;font-weight:600;color:var(--primary);">${app?.downloadUrl ? '✅ رابط موجود: '+app.downloadUrl.substring(0,40)+'...' : ''}</div>
                </div>
                <div class="form-group"><label>وسوم (بفواصل)</label><input type="text" id="appTags" value="${(app?.tags||[]).join(', ')}"></div>
                <div class="form-group"><label><input type="checkbox" id="appFeatured" ${app?.featured?'checked':''}> مميز</label></div>
                <button class="btn btn-primary" onclick="saveApp()">💾 ${isEdit?'تحديث':'حفظ'}</button>
                <button class="btn btn-ghost" onclick="document.getElementById('adminFormContainer').innerHTML='';editingAppId=null;">إلغاء</button>`;
        }

        function openCloudinaryUploader() {
            if (!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME === "YOUR_CLOUD_NAME") {
                showToast('⚠️ اضبط Cloudinary cloud name أولاً', 'error'); return;
            }
            cloudinary.openUploadWidget({
                cloudName: dw5psz5y2,
                uploadPreset: unsigned_apps,
                sources: ['local', 'url'],
                resourceType: 'auto',
                clientAllowedFormats: ['apk','exe','dmg','zip','rar','ipa','7z','tar.gz'],
                maxFileSize: 200000000 // 200MB
            }, (error, result) => {
                if (error) { showToast('❌ فشل الرفع: '+error.message, 'error'); return; }
                if (result && result.event === 'success') {
                    const url = result.info.secure_url;
                    document.getElementById('appDownloadUrl').value = url;
                    document.getElementById('uploadStatus').innerHTML = `✅ تم الرفع: <a href="${url}" target="_blank">${url.substring(0,40)}...</a>`;
                    showToast('✅ تم رفع الملف بنجاح!', 'success');
                }
            });
        }

        async function saveApp() {
            const name = document.getElementById('appName').value.trim();
            const shortDesc = document.getElementById('appShortDesc').value.trim();
            if(!name || !shortDesc) { showToast('⚠️ الاسم والوصف مطلوبان', 'error'); return; }
            const downloadUrl = document.getElementById('appDownloadUrl').value.trim();
            if(!downloadUrl) { showToast('⚠️ ارفع ملف التطبيق أولاً', 'error'); return; }

            const data = {
                name, nameEn: document.getElementById('appNameEn').value.trim(),
                category: document.getElementById('appCategory').value,
                version: document.getElementById('appVersion').value.trim(),
                shortDesc, fullDesc: document.getElementById('appFullDesc').value.trim(),
                size: document.getElementById('appSize').value.trim(),
                developer: document.getElementById('appDeveloper').value.trim(),
                requirements: document.getElementById('appRequirements').value.trim(),
                iconUrl: document.getElementById('appIconUrl').value.trim(),
                downloadUrl,
                tags: document.getElementById('appTags').value.split(',').map(t=>t.trim()).filter(Boolean),
                featured: document.getElementById('appFeatured').checked
            };
            try {
                if(editingAppId) await updateAppInFirestore(editingAppId, data);
                else await addAppToFirestore(data);
                showToast('✅ تم الحفظ', 'success');
                editingAppId = null; document.getElementById('adminFormContainer').innerHTML = '';
                await refreshApps(); renderAdminAppList(); renderApps();
            } catch(e) { showToast('❌ خطأ في الحفظ', 'error'); }
        }

        async function deleteApp(id) {
            if(!confirm('حذف التطبيق؟')) return;
            await deleteAppFromFirestore(id); showToast('🗑️ حُذف', 'info'); await refreshApps(); renderAdminAppList(); renderApps();
        }
        async function refreshApps() {
            allApps = await fetchApps(); renderApps();
            if(document.getElementById('adminAppList')) renderAdminAppList();
        }

        appModalOverlay.addEventListener('click', e=>{ if(e.target===appModalOverlay) closeModal(); });
        adminOverlay.addEventListener('click', e=>{ if(e.target===adminOverlay) closeAdminPanel(); });
        document.addEventListener('keydown', e=>{ if(e.key==='Escape'){ closeModal(); closeAdminPanel(); } });
        window.addEventListener('scroll', ()=> header.classList.toggle('scrolled', window.scrollY>50));

        createParticles();
        refreshApps();
    </script>
</body>
</html>
