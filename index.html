    <style>
        :root {
            --bg: #f5f7fb;
            --surface: #ffffff;
            --surface-alt: #f0f2f8;
            --text: #1a1d2e;
            --text-secondary: #5a5f78;
            --text-muted: #8b8fa8;
            --primary: #5b4cf0;
            --primary-light: #7c6ff7;
            --primary-dark: #4338ca;
            --primary-glow: rgba(91, 76, 240, 0.25);
            --accent: #f7931e;
            --accent-light: #ffb347;
            --green: #10b981;
            --green-light: #d1fae5;
            --red: #ef4444;
            --red-light: #fee2e2;
            --border: #e5e7f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.06);
            --shadow: 0 4px 16px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.04);
            --shadow-lg: 0 20px 50px rgba(0,0,0,0.1), 0 8px 20px rgba(0,0,0,0.06);
            --shadow-xl: 0 32px 64px rgba(0,0,0,0.12), 0 12px 32px rgba(0,0,0,0.08);
            --radius-sm: 10px;
            --radius: 16px;
            --radius-lg: 22px;
            --radius-xl: 28px;
            --transition: 0.3s cubic-bezier(0.4,0,0.2,1);
            --transition-fast: 0.18s cubic-bezier(0.4,0,0.2,1);
            --transition-slow: 0.5s cubic-bezier(0.4,0,0.2,1);
            --font: 'Segoe UI', 'Tajawal', 'Cairo', system-ui, -apple-system, sans-serif;
        }

        * { margin:0; padding:0; box-sizing:border-box; }
        html { scroll-behavior:smooth; -webkit-tap-highlight-color:transparent; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); line-height:1.6; min-height:100vh; overflow-x:hidden; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; }

        /* سكرول بار */
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#d1d5e0; border-radius:20px; }
        ::-webkit-scrollbar-thumb:hover { background:#b0b7c9; }

        /* جسيمات الخلفية */
        .particles-container { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; overflow:hidden; }
        .particle { position:absolute; border-radius:50%; animation:floatUp linear infinite; opacity:0; }
        @keyframes floatUp {
            0% { transform:translateY(105vh) scale(0); opacity:0; }
            10% { opacity:1; }
            90% { opacity:0.5; }
            100% { transform:translateY(-10vh) scale(1.2); opacity:0; }
        }

        /* الهيدر */
        .header {
            position:sticky; top:0; z-index:100;
            background:rgba(255,255,255,0.78); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
            border-bottom:1px solid var(--border); transition:var(--transition); padding:0 20px;
        }
        .header.scrolled { box-shadow:var(--shadow); background:rgba(255,255,255,0.92); }
        .nav { max-width:1300px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; height:64px; gap:16px; }
        .logo { display:flex; align-items:center; gap:10px; font-size:1.35rem; font-weight:800; color:var(--primary); text-decoration:none; letter-spacing:-0.5px; white-space:nowrap; transition:var(--transition-fast); }
        .logo:hover { transform:scale(1.03); }
        .logo-icon {
            width:42px; height:42px; background:linear-gradient(135deg,var(--primary),var(--primary-light));
            border-radius:var(--radius-sm); display:flex; align-items:center; justify-content:center;
            font-size:1.5rem; color:#fff; box-shadow:0 4px 14px var(--primary-glow); animation:logoPulse 3s ease-in-out infinite;
        }
        @keyframes logoPulse {
            0%,100% { box-shadow:0 4px 14px var(--primary-glow); }
            50% { box-shadow:0 6px 24px rgba(91,76,240,0.4); }
        }
        .nav-actions { display:flex; align-items:center; gap:10px; }
        .btn {
            padding:10px 20px; border-radius:50px; font-weight:600; font-size:0.9rem; cursor:pointer;
            border:none; transition:var(--transition-fast); text-decoration:none; display:inline-flex;
            align-items:center; gap:7px; font-family:var(--font); white-space:nowrap; letter-spacing:0.2px;
        }
        .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#fff; box-shadow:0 4px 14px var(--primary-glow); }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(91,76,240,0.35); }
        .btn-outline { background:transparent; color:var(--primary); border:2px solid var(--primary); }
        .btn-outline:hover { background:var(--primary); color:#fff; transform:translateY(-2px); }
        .btn-ghost { background:transparent; color:var(--text-secondary); padding:8px 14px; }
        .btn-ghost:hover { background:var(--surface-alt); color:var(--text); }
        .btn-sm { padding:7px 14px; font-size:0.8rem; border-radius:40px; }
        .btn-icon { width:40px; height:40px; padding:0; border-radius:50%; justify-content:center; font-size:1.2rem; }
        .btn-danger { background:var(--red); color:#fff; }
        .btn-danger:hover { background:#dc2626; }
        .btn-xs { padding:6px 12px; font-size:0.75rem; border-radius:30px; }

        /* المحتوى الرئيسي */
        .main-content { position:relative; z-index:1; max-width:1300px; margin:0 auto; padding:20px 20px 60px; }

        /* الهيرو */
        .hero { text-align:center; padding:50px 20px 40px; animation:fadeInUp 0.7s ease-out; }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(30px); }
            to { opacity:1; transform:translateY(0); }
        }
        .hero-badge {
            display:inline-block; padding:8px 18px; background:var(--primary-glow); color:var(--primary);
            border-radius:50px; font-weight:700; font-size:0.85rem; margin-bottom:16px;
            animation:badgeGlow 2.5s ease-in-out infinite;
        }
        @keyframes badgeGlow {
            0%,100% { box-shadow:0 0 0 0 rgba(91,76,240,0.3); }
            50% { box-shadow:0 0 0 14px rgba(91,76,240,0); }
        }
        .hero h1 {
            font-size:clamp(2rem,5vw,3.2rem); font-weight:900; line-height:1.25; margin-bottom:12px;
            background:linear-gradient(135deg,var(--text) 30%,var(--primary-dark));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
        }
        .hero-subtitle { font-size:1.1rem; color:var(--text-secondary); max-width:600px; margin:0 auto 24px; line-height:1.7; }
        .hero-stats { display:flex; justify-content:center; gap:30px; flex-wrap:wrap; margin-top:10px; }
        .hero-stat { text-align:center; animation:fadeInUp 0.7s ease-out backwards; }
        .hero-stat:nth-child(2) { animation-delay:0.1s; }
        .hero-stat:nth-child(3) { animation-delay:0.2s; }
        .hero-stat-value { font-size:2rem; font-weight:900; color:var(--primary); }
        .hero-stat-label { font-size:0.85rem; color:var(--text-muted); }

        /* البحث والتصفية */
        .search-filter-section { margin:20px 0 30px; animation:fadeInUp 0.6s ease-out 0.2s backwards; }
        .search-wrapper {
            display:flex; align-items:center; background:var(--surface); border-radius:60px; padding:6px 6px 6px 22px;
            box-shadow:var(--shadow); border:2px solid transparent; transition:var(--transition); max-width:650px; margin:0 auto 20px;
        }
        .search-wrapper:focus-within {
            border-color:var(--primary); box-shadow:var(--shadow-lg), 0 0 0 8px var(--primary-glow);
        }
        .search-wrapper input {
            flex:1; border:none; outline:none; font-size:1rem; padding:12px 6px; background:transparent;
            font-family:var(--font); color:var(--text);
        }
        .search-wrapper input::placeholder { color:var(--text-muted); }
        .search-btn {
            background:var(--primary); color:#fff; border:none; border-radius:50px; padding:12px 24px;
            cursor:pointer; font-weight:700; font-size:0.9rem; transition:var(--transition-fast); font-family:var(--font); white-space:nowrap;
        }
        .search-btn:hover { background:var(--primary-dark); transform:scale(1.03); }
        .category-tabs { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; padding:0; }
        .cat-tab {
            padding:10px 20px; border-radius:50px; border:2px solid var(--border); background:var(--surface);
            cursor:pointer; font-weight:600; font-size:0.88rem; transition:var(--transition-fast);
            font-family:var(--font); color:var(--text-secondary); white-space:nowrap;
        }
        .cat-tab:hover { border-color:var(--primary-light); color:var(--primary); transform:translateY(-1px); }
        .cat-tab.active {
            background:var(--primary); color:#fff; border-color:var(--primary); box-shadow:0 4px 14px var(--primary-glow);
        }
        .results-info { text-align:center; margin:10px 0; color:var(--text-muted); font-size:0.9rem; }

        /* شبكة التطبيقات */
        .apps-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(280px,1fr)); gap:20px; }
        .app-card {
            background:var(--surface); border-radius:var(--radius-lg); padding:22px; box-shadow:var(--shadow-sm);
            cursor:pointer; transition:var(--transition); border:2px solid transparent; position:relative;
            overflow:hidden; animation:fadeInUp 0.5s ease-out backwards; display:flex; flex-direction:column; gap:12px;
        }
        .app-card:hover { transform:translateY(-6px); box-shadow:var(--shadow-xl); border-color:var(--primary-light); }
        .app-card:active { transform:scale(0.98); }
        .app-card::after {
            content:''; position:absolute; top:-50%; right:-50%; width:100%; height:100%;
            background:radial-gradient(circle, var(--primary-glow) 0%, transparent 70%); opacity:0;
            transition:var(--transition-slow); pointer-events:none;
        }
        .app-card:hover::after { opacity:1; }
        .app-card-header { display:flex; align-items:center; gap:14px; }
        .app-icon {
            width:56px; height:56px; border-radius:var(--radius-sm); object-fit:cover; background:var(--surface-alt);
            flex-shrink:0; box-shadow:var(--shadow-sm); transition:var(--transition);
        }
        .app-card:hover .app-icon { transform:scale(1.06); box-shadow:var(--shadow); }
        .app-icon-placeholder {
            width:56px; height:56px; border-radius:var(--radius-sm); background:linear-gradient(135deg,var(--primary),var(--primary-light));
            display:flex; align-items:center; justify-content:center; font-size:1.6rem; color:#fff; flex-shrink:0;
        }
        .app-card-info { flex:1; min-width:0; }
        .app-card-name {
            font-weight:800; font-size:1.05rem; color:var(--text); line-height:1.3;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
        }
        .app-card-category { font-size:0.78rem; color:var(--primary); font-weight:600; margin-top:2px; }
        .app-card-desc {
            font-size:0.88rem; color:var(--text-secondary); line-height:1.5;
            display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; flex:1;
        }
        .app-card-meta { display:flex; gap:14px; font-size:0.78rem; color:var(--text-muted); align-items:center; flex-wrap:wrap; }
        .app-card-meta span { display:flex; align-items:center; gap:4px; }
        .app-card-badge {
            position:absolute; top:14px; left:14px; background:var(--accent); color:#fff; padding:5px 12px;
            border-radius:50px; font-size:0.72rem; font-weight:700; z-index:2;
        }

        /* حالة فارغة وسكيليتون */
        .empty-state { text-align:center; padding:50px 20px; color:var(--text-muted); grid-column:1/-1; }
        .empty-state-icon { font-size:4rem; margin-bottom:16px; opacity:0.6; }
        .empty-state h3 { font-size:1.3rem; color:var(--text); margin-bottom:8px; }
        .skeleton {
            background:linear-gradient(90deg,#e8eaf0 25%,#f0f2f8 50%,#e8eaf0 75%);
            background-size:200% 100%; animation:shimmer 1.6s ease-in-out infinite; border-radius:8px;
        }
        @keyframes shimmer {
            0% { background-position:200% 0; }
            100% { background-position:-200% 0; }
        }
        .skeleton-card { height:200px; border-radius:var(--radius-lg); }

        /* النافذة المنبثقة */
        .modal-overlay {
            position:fixed; inset:0; z-index:200; background:rgba(0,0,0,0.55); backdrop-filter:blur(6px);
            -webkit-backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:center; padding:20px;
            animation:fadeIn 0.25s ease-out;
        }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .modal {
            background:var(--surface); border-radius:var(--radius-xl); max-width:620px; width:100%; max-height:85vh;
            overflow-y:auto; box-shadow:var(--shadow-xl); animation:modalIn 0.35s cubic-bezier(0.4,0,0.2,1); position:relative;
        }
        @keyframes modalIn {
            from { opacity:0; transform:translateY(40px) scale(0.94); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        .modal-close {
            position:sticky; top:12px; float:left; z-index:10; width:40px; height:40px; border-radius:50%;
            background:var(--surface-alt); border:none; cursor:pointer; font-size:1.3rem;
            display:flex; align-items:center; justify-content:center; transition:var(--transition-fast);
            color:var(--text); margin:8px 8px 0 0;
        }
        .modal-close:hover { background:#e8eaf0; transform:rotate(90deg); }
        .modal-body { padding:8px 28px 28px; }
        .modal-icon { width:80px; height:80px; border-radius:var(--radius); object-fit:cover; margin-bottom:16px; box-shadow:var(--shadow); }
        .modal-icon-placeholder {
            width:80px; height:80px; border-radius:var(--radius); background:linear-gradient(135deg,var(--primary),var(--primary-light));
            display:flex; align-items:center; justify-content:center; font-size:2.2rem; color:#fff; margin-bottom:16px;
        }
        .modal h2 { font-size:1.6rem; font-weight:900; margin-bottom:6px; }
        .modal .modal-category {
            display:inline-block; padding:5px 14px; background:var(--primary-glow); color:var(--primary);
            border-radius:50px; font-weight:700; font-size:0.8rem; margin-bottom:14px;
        }
        .modal-desc { color:var(--text-secondary); line-height:1.8; margin-bottom:16px; white-space:pre-line; }
        .modal-meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
        .modal-meta-item { background:var(--surface-alt); padding:12px 16px; border-radius:var(--radius-sm); font-size:0.85rem; }
        .modal-meta-item strong { display:block; color:var(--text); font-weight:700; }
        .modal-meta-item span { color:var(--text-muted); font-size:0.8rem; }
        .btn-download {
            display:flex; align-items:center; justify-content:center; gap:10px; width:100%; padding:16px;
            background:linear-gradient(135deg,var(--green),#059669); color:#fff; border:none; border-radius:60px;
            font-size:1.1rem; font-weight:800; cursor:pointer; transition:var(--transition); font-family:var(--font);
            letter-spacing:0.3px; box-shadow:0 6px 22px rgba(16,185,129,0.3);
        }
        .btn-download:hover { transform:translateY(-3px); box-shadow:0 12px 32px rgba(16,185,129,0.4); }
        .btn-download:active { transform:scale(0.96); }
        .download-icon { font-size:1.4rem; animation:bounceDown 1.8s ease-in-out infinite; }
        @keyframes bounceDown {
            0%,100% { transform:translateY(0); }
            30% { transform:translateY(6px); }
            50% { transform:translateY(0); }
            70% { transform:translateY(3px); }
        }

        /* لوحة التحكم */
        .admin-overlay {
            position:fixed; inset:0; z-index:300; background:rgba(0,0,0,0.6); backdrop-filter:blur(8px);
            -webkit-backdrop-filter:blur(8px); display:flex; align-items:center; justify-content:center; padding:20px;
        }
        .admin-panel {
            background:var(--surface); border-radius:var(--radius-xl); max-width:700px; width:100%; max-height:90vh;
            overflow-y:auto; box-shadow:var(--shadow-xl); padding:28px; animation:modalIn 0.35s;
        }
        .admin-panel h2 { font-size:1.5rem; font-weight:900; margin-bottom:20px; display:flex; align-items:center; gap:10px; }
        .form-group { margin-bottom:16px; }
        .form-group label { display:block; font-weight:700; margin-bottom:5px; font-size:0.9rem; color:var(--text); }
        .form-group input, .form-group textarea, .form-group select {
            width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:var(--radius-sm);
            font-family:var(--font); font-size:0.95rem; transition:var(--transition-fast); background:var(--surface-alt);
            color:var(--text); resize:vertical;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus {
            outline:none; border-color:var(--primary); box-shadow:0 0 0 6px var(--primary-glow); background:#fff;
        }
        .form-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
        @media (max-width:500px) { .form-row { grid-template-columns:1fr; } }
        .admin-app-list-item {
            display:flex; align-items:center; justify-content:space-between; padding:12px 16px;
            background:var(--surface-alt); border-radius:var(--radius-sm); margin-bottom:8px; gap:10px; flex-wrap:wrap;
        }
        .admin-app-list-item span { font-weight:600; flex:1; min-width:120px; }
        .admin-app-list-item .actions { display:flex; gap:6px; }

        /* التوست */
        .toast-container {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%); z-index:999;
            display:flex; flex-direction:column; gap:8px; pointer-events:none;
        }
        .toast {
            padding:14px 22px; border-radius:50px; color:#fff; font-weight:700; font-size:0.9rem;
            animation:toastIn 0.4s cubic-bezier(0.4,0,0.2,1); pointer-events:auto; box-shadow:var(--shadow-lg);
            text-align:center; white-space:nowrap;
        }
        .toast.success { background:#10b981; }
        .toast.error { background:#ef4444; }
        .toast.info { background:var(--primary); }
        @keyframes toastIn {
            from { opacity:0; transform:translateY(30px) scale(0.9); }
            to { opacity:1; transform:translateY(0) scale(1); }
        }
        @keyframes toastOut {
            from { opacity:1; transform:translateY(0) scale(1); }
            to { opacity:0; transform:translateY(-20px) scale(0.8); }
        }

        /* الفوتر */
        .footer { text-align:center; padding:30px 20px; color:var(--text-muted); font-size:0.85rem; position:relative; z-index:1; }
        .footer a { color:var(--primary); text-decoration:none; font-weight:600; }

        /* كلاس الإخفاء */
        .hidden { display:none !important; }

        /* تجاوب الشاشات */
        @media (max-width:768px) {
            .apps-grid { grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }
            .hero h1 { font-size:1.8rem; }
            .hero-subtitle { font-size:0.95rem; }
            .nav { height:56px; }
            .logo { font-size:1.1rem; }
            .logo-icon { width:34px; height:34px; font-size:1.2rem; }
            .btn { padding:8px 14px; font-size:0.78rem; }
            .cat-tab { padding:8px 14px; font-size:0.78rem; }
            .modal { max-width:95vw; border-radius:var(--radius-lg); }
            .modal-body { padding:8px 18px 20px; }
            .admin-panel { padding:18px; max-width:95vw; }
            .hero-stats { gap:16px; }
            .hero-stat-value { font-size:1.5rem; }
        }
        @media (max-width:400px) {
            .apps-grid { grid-template-columns:1fr; }
            .app-card { padding:16px; }
            .search-wrapper { padding:4px 4px 4px 14px; border-radius:40px; }
            .search-wrapper input { font-size:0.9rem; padding:10px 4px; }
            .search-btn { padding:10px 16px; font-size:0.8rem; }
        }
    </style>
</head>
<body>

    <!-- جسيمات متحركة -->
    <div class="particles-container" id="particlesContainer" aria-hidden="true"></div>

    <!-- رأس الصفحة -->
    <header class="header" id="header">
        <nav class="nav">
            <a href="#" class="logo" title="مكتبتك الرقمية - الرئيسية">
                <div class="logo-icon">📱</div>
                <span>مكتبتك الرقمية</span>
            </a>
            <div class="nav-actions">
                <button class="btn btn-ghost btn-sm" onclick="openAdminPanel()" title="لوحة التحكم">
                    ⚙️ لوحة التحكم
                </button>
            </div>
        </nav>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="main-content" id="mainContent">
        <!-- قسم الترحيب والإحصائيات -->
        <section class="hero" aria-labelledby="heroTitle">
            <div class="hero-badge">✨ منصة موثوقة لتحميل التطبيقات</div>
            <h1 id="heroTitle">مكتبتك الرقمية المتكاملة</h1>
            <p class="hero-subtitle">اكتشف وحمّل أفضل التطبيقات والبرامج لهاتفك وحاسوبك من مكان واحد. جميع التطبيقات محدثة وآمنة.</p>
            <div class="hero-stats">
                <div class="hero-stat">
                    <div class="hero-stat-value" id="statAppsCount">0</div>
                    <div class="hero-stat-label">تطبيق متاح</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value" id="statDownloads">0</div>
                    <div class="hero-stat-label">عملية تحميل</div>
                </div>
                <div class="hero-stat">
                    <div class="hero-stat-value">✓</div>
                    <div class="hero-stat-label">آمن وموثوق</div>
                </div>
            </div>
        </section>

        <!-- البحث والفئات -->
        <section class="search-filter-section" aria-label="بحث وتصفية">
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="🔍 ابحث عن تطبيق... (مثال: واتساب، فوتوشوب، لعبة)"
                       autocomplete="off" aria-label="البحث عن تطبيق">
                <button class="search-btn" onclick="performSearch()" aria-label="زر البحث">بحث</button>
            </div>
            <div class="category-tabs" id="categoryTabs" role="tablist" aria-label="فئات التطبيقات">
                <button class="cat-tab active" data-category="all" role="tab" aria-selected="true">📋 الكل</button>
                <button class="cat-tab" data-category="mobile" role="tab" aria-selected="false">📱 تطبيقات الهاتف</button>
                <button class="cat-tab" data-category="desktop" role="tab" aria-selected="false">💻 تطبيقات الحاسوب</button>
                <button class="cat-tab" data-category="games" role="tab" aria-selected="false">🎮 ألعاب</button>
                <button class="cat-tab" data-category="tools" role="tab" aria-selected="false">🛠️ أدوات</button>
                <button class="cat-tab" data-category="education" role="tab" aria-selected="false">📚 تعليم</button>
            </div>
            <div class="results-info" id="resultsInfo"></div>
        </section>

        <!-- شبكة التطبيقات -->
        <section class="apps-grid" id="appsGrid" aria-label="قائمة التطبيقات">
            <!-- عناصر تحميل وهمية -->
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
        </section>
    </main>

    <!-- الفوتر -->
    <footer class="footer">
        <p>© 2025 <strong>مكتبتك الرقمية</strong> · جميع الحقوق محفوظة · صُنع بحب ❤️</p>
    </footer>

    <!-- نافذة تفاصيل التطبيق -->
    <div class="modal-overlay hidden" id="appModalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal" id="appModal">
            <button class="modal-close" onclick="closeModal()" aria-label="إغلاق">✕</button>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <!-- نافذة لوحة التحكم -->
    <div class="admin-overlay hidden" id="adminOverlay" role="dialog" aria-modal="true" aria-labelledby="adminTitle">
        <div class="admin-panel" id="adminPanel">
            <button class="modal-close" onclick="closeAdminPanel()" aria-label="إغلاق" style="float:left;position:sticky;top:0;">✕</button>
            <div id="adminContent"></div>
        </div>
    </div>

    <!-- حاوية الإشعارات -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ==================== CONFIGURATION ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDvDaK7HtwtQ_VmR9cKoDq6sdrUyL_Hfls",
            authDomain: "system-library-52cc1.firebaseapp.com",
            projectId: "system-library-52cc1",
            storageBucket: "system-library-52cc1.firebasestorage.app",
            messagingSenderId: "139702257477",
            appId: "1:139702257477:web:1615f6c263afb3e1d1e02c"
        };

        // Cloudinary configuration – تم تعبئتها بالبيانات التي أرسلتها
        const CLOUDINARY_CLOUD_NAME = "dw5psz5y2";
        const CLOUDINARY_UPLOAD_PRESET = "unsigned_apps";

        // Initialize Firebase
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log('✅ Firebase initialized');
        } catch (e) {
            console.error('Firebase error:', e);
            db = null;
        }

        // ==================== GLOBAL STATE ====================
        const ADMIN_PASSWORD = 'admin2025digital';
        let allApps = [];
        let currentCategory = 'all';
        let searchQuery = '';
        let isAdminLoggedIn = false;
        let editingAppId = null;

        // DOM references
        const appsGrid = document.getElementById('appsGrid');
        const searchInput = document.getElementById('searchInput');
        const categoryTabs = document.getElementById('categoryTabs');
        const resultsInfo = document.getElementById('resultsInfo');
        const appModalOverlay = document.getElementById('appModalOverlay');
        const modalBody = document.getElementById('modalBody');
        const adminOverlay = document.getElementById('adminOverlay');
        const adminContent = document.getElementById('adminContent');
        const toastContainer = document.getElementById('toastContainer');
        const statAppsCount = document.getElementById('statAppsCount');
        const statDownloads = document.getElementById('statDownloads');
        const particlesContainer = document.getElementById('particlesContainer');
        const header = document.getElementById('header');

        // ==================== PARTICLES ====================
        function createParticles() {
            const colors = ['#5b4cf0', '#7c6ff7', '#f7931e', '#10b981', '#06b6d4', '#8b5cf6'];
            for (let i = 0; i < 35; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                const size = Math.random() * 8 + 3;
                particle.style.width = size + 'px';
                particle.style.height = size + 'px';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.animationDuration = Math.random() * 14 + 8 + 's';
                particle.style.animationDelay = Math.random() * 12 + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // ==================== TOAST ====================
        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'toastOut 0.4s ease-in forwards';
                toast.addEventListener('animationend', () => toast.remove());
            }, 3000);
        }

        // ==================== FIREBASE OPERATIONS ====================
        async function fetchApps() {
            if (!db) return [];
            try {
                const snapshot = await db.collection('apps').orderBy('createdAt', 'desc').get();
                const apps = [];
                snapshot.forEach(doc => apps.push({ id: doc.id, ...doc.data() }));
                return apps;
            } catch (error) {
                console.error('Error fetching apps:', error);
                showToast('⚠️ خطأ في جلب التطبيقات من قاعدة البيانات', 'error');
                return [];
            }
        }

        async function addAppToFirestore(appData) {
            if (!db) throw new Error('Firebase not initialized');
            const docRef = await db.collection('apps').add({
                ...appData,
                downloads: 0,
                createdAt: firebase.firestore.FieldValue.serverTimestamp(),
            });
            return docRef.id;
        }

        async function updateAppInFirestore(appId, appData) {
            if (!db) throw new Error('Firebase not initialized');
            await db.collection('apps').doc(appId).update(appData);
        }

        async function deleteAppFromFirestore(appId) {
            if (!db) throw new Error('Firebase not initialized');
            await db.collection('apps').doc(appId).delete();
        }

        async function incrementDownloadCount(appId) {
            if (!db) return;
            try {
                await db.collection('apps').doc(appId).update({
                    downloads: firebase.firestore.FieldValue.increment(1),
                });
            } catch (error) {
                console.error('Error incrementing download count:', error);
            }
        }

        // ==================== RENDER APPS ====================
        function getFilteredApps() {
            let filtered = [...allApps];
            if (currentCategory !== 'all') {
                filtered = filtered.filter(app => app.category === currentCategory);
            }
            if (searchQuery.trim()) {
                const q = searchQuery.trim().toLowerCase();
                filtered = filtered.filter(app => {
                    const searchStr = [
                        app.name || '', app.nameEn || '', app.shortDesc || '', app.fullDesc || '',
                        app.developer || '', ...(app.tags || []),
                    ].join(' ').toLowerCase();
                    return searchStr.includes(q);
                });
            }
            return filtered;
        }

        function renderApps() {
            const filtered = getFilteredApps();
            resultsInfo.textContent = filtered.length > 0 ?
                `🔍 تم العثور على ${filtered.length} تطبيق` :
                '😕 لا توجد تطبيقات تطابق بحثك';

            if (filtered.length === 0 && allApps.length === 0 && db) {
                appsGrid.innerHTML = Array(6).fill('<div class="skeleton skeleton-card"></div>').join('');
                return;
            }
            if (filtered.length === 0) {
                appsGrid.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <h3>لا توجد تطبيقات حالياً</h3>
                        <p>لم يتم العثور على تطبيقات تطابق معايير البحث. جرب كلمة بحث مختلفة أو تصفح جميع الفئات.</p>
                    </div>`;
                return;
            }

            appsGrid.innerHTML = filtered.map((app, index) => {
                const iconHtml = app.iconUrl ?
                    `<img src="${app.iconUrl}" alt="${app.name}" class="app-icon" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="app-icon-placeholder" style="display:none;">${(app.name || 'ت')[0]}</div>` :
                    `<div class="app-icon-placeholder">${(app.name || 'ت')[0]}</div>`;

                const categoryLabels = {
                    'mobile': '📱 تطبيق هاتف',
                    'desktop': '💻 تطبيق حاسوب',
                    'games': '🎮 لعبة',
                    'tools': '🛠️ أداة',
                    'education': '📚 تعليم',
                };
                const catLabel = categoryLabels[app.category] || app.category || 'تطبيق';

                return `
                    <article class="app-card" style="animation-delay:${index * 0.06}s" 
                             onclick="openAppDetail('${app.id}')" 
                             role="button" tabindex="0" 
                             aria-label="${app.name} - ${catLabel}"
                             onkeydown="if(event.key==='Enter')openAppDetail('${app.id}')">
                        ${app.featured ? '<span class="app-card-badge">⭐ مميز</span>' : ''}
                        <div class="app-card-header">
                            ${iconHtml}
                            <div class="app-card-info">
                                <h3 class="app-card-name">${app.name || 'تطبيق بدون اسم'}</h3>
                                <div class="app-card-category">${catLabel}</div>
                            </div>
                        </div>
                        <p class="app-card-desc">${app.shortDesc || 'لا يوجد وصف مختصر'}</p>
                        <div class="app-card-meta">
                            ${app.size ? `<span>📦 ${app.size}</span>` : ''}
                            ${app.version ? `<span>🏷️ ${app.version}</span>` : ''}
                            <span>⬇️ ${app.downloads || 0}</span>
                        </div>
                    </article>`;
            }).join('');

            // تحديث الإحصائيات
            statAppsCount.textContent = allApps.length;
            const totalDownloads = allApps.reduce((sum, app) => sum + (app.downloads || 0), 0);
            statDownloads.textContent = totalDownloads.toLocaleString('ar-EG');
        }

        // ==================== MODAL (تفاصيل التطبيق) ====================
        function openAppDetail(appId) {
            const app = allApps.find(a => a.id === appId);
            if (!app) return;

            const categoryLabels = {
                'mobile': '📱 تطبيق هاتف',
                'desktop': '💻 تطبيق حاسوب',
                'games': '🎮 لعبة',
                'tools': '🛠️ أداة',
                'education': '📚 تعليم',
            };
            const catLabel = categoryLabels[app.category] || app.category || 'تطبيق';

            const iconHtml = app.iconUrl ?
                `<img src="${app.iconUrl}" alt="${app.name}" class="modal-icon" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"><div class="modal-icon-placeholder" style="display:none;">${(app.name || 'ت')[0]}</div>` :
                `<div class="modal-icon-placeholder">${(app.name || 'ت')[0]}</div>`;

            modalBody.innerHTML = `
                ${iconHtml}
                <h2 id="modalTitle">${app.name || 'تطبيق'}</h2>
                <span class="modal-category">${catLabel}</span>
                <p class="modal-desc">${app.fullDesc || app.shortDesc || 'لا يوجد وصف مفصل لهذا التطبيق.'}</p>
                <div class="modal-meta-grid">
                    ${app.version ? `<div class="modal-meta-item"><strong>الإصدار</strong><span>${app.version}</span></div>` : ''}
                    ${app.size ? `<div class="modal-meta-item"><strong>الحجم</strong><span>${app.size}</span></div>` : ''}
                    ${app.developer ? `<div class="modal-meta-item"><strong>المطور</strong><span>${app.developer}</span></div>` : ''}
                    ${app.requirements ? `<div class="modal-meta-item"><strong>المتطلبات</strong><span>${app.requirements}</span></div>` : ''}
                    <div class="modal-meta-item"><strong>عدد التحميلات</strong><span>⬇️ ${(app.downloads || 0).toLocaleString('ar-EG')}</span></div>
                    ${app.category ? `<div class="modal-meta-item"><strong>الفئة</strong><span>${catLabel}</span></div>` : ''}
                </div>
                ${app.downloadUrl ? `
                    <a href="${app.downloadUrl}" target="_blank" rel="noopener noreferrer" 
                       class="btn-download" onclick="handleDownload('${app.id}')" 
                       aria-label="تحميل ${app.name}">
                        <span class="download-icon">⬇️</span> تحميل الآن
                    </a>` : 
                    '<p style="text-align:center;color:var(--text-muted);">⚠️ رابط التحميل غير متوفر حالياً</p>'}
            `;
            appModalOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            appModalOverlay.classList.add('hidden');
            document.body.style.overflow = '';
            modalBody.innerHTML = '';
        }

        async function handleDownload(appId) {
            await incrementDownloadCount(appId);
            const app = allApps.find(a => a.id === appId);
            if (app) app.downloads = (app.downloads || 0) + 1;
            const totalDownloads = allApps.reduce((sum, a) => sum + (a.downloads || 0), 0);
            statDownloads.textContent = totalDownloads.toLocaleString('ar-EG');
            showToast('✅ جاري التحميل... شكراً لاستخدامك مكتبتك الرقمية!', 'success');
            setTimeout(() => {
                closeModal();
                renderApps();
            }, 800);
        }

        // ==================== SEARCH & FILTER ====================
        function performSearch() {
            searchQuery = searchInput.value;
            renderApps();
        }

        searchInput.addEventListener('input', () => {
            clearTimeout(searchInput._debounce);
            searchInput._debounce = setTimeout(() => {
                searchQuery = searchInput.value;
                renderApps();
            }, 350);
        });

        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                searchQuery = searchInput.value;
                renderApps();
            }
        });

        categoryTabs.addEventListener('click', (e) => {
            const tab = e.target.closest('.cat-tab');
            if (!tab) return;
            currentCategory = tab.dataset.category;
            categoryTabs.querySelectorAll('.cat-tab').forEach(t => {
                t.classList.remove('active');
                t.setAttribute('aria-selected', 'false');
            });
            tab.classList.add('active');
            tab.setAttribute('aria-selected', 'true');
            renderApps();
        });

        // ==================== ADMIN PANEL ====================
        function openAdminPanel() {
            if (!isAdminLoggedIn) {
                showAdminLogin();
            } else {
                showAdminDashboard();
            }
            adminOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeAdminPanel() {
            adminOverlay.classList.add('hidden');
            document.body.style.overflow = '';
            editingAppId = null;
        }

        function showAdminLogin() {
            adminContent.innerHTML = `
                <h2 id="adminTitle">🔐 دخول لوحة التحكم</h2>
                <p style="color:var(--text-secondary);margin-bottom:16px;">أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
                <div class="form-group">
                    <label for="adminPassword">كلمة المرور</label>
                    <input type="password" id="adminPassword" placeholder="أدخل كلمة المرور..." autocomplete="off">
                </div>
                <button class="btn btn-primary" onclick="adminLogin()" style="width:100%;justify-content:center;">
                    🔓 دخول
                </button>
                <p style="text-align:center;margin-top:12px;font-size:0.78rem;color:var(--text-muted);">
                    كلمة المرور الافتراضية: <code>admin2025digital</code>
                </p>
            `;
        }

        function adminLogin() {
            const password = document.getElementById('adminPassword').value;
            if (password === ADMIN_PASSWORD) {
                isAdminLoggedIn = true;
                showToast('✅ تم تسجيل الدخول بنجاح', 'success');
                showAdminDashboard();
            } else {
                showToast('❌ كلمة المرور غير صحيحة', 'error');
            }
        }

        function showAdminDashboard() {
            adminContent.innerHTML = `
                <h2 id="adminTitle">⚙️ لوحة التحكم - إدارة التطبيقات</h2>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;">
                    <button class="btn btn-primary btn-sm" onclick="showAddAppForm()">➕ إضافة تطبيق جديد</button>
                    <button class="btn btn-outline btn-sm" onclick="refreshApps()">🔄 تحديث البيانات</button>
                    <button class="btn btn-ghost btn-sm" onclick="isAdminLoggedIn=false;showAdminLogin();">🚪 تسجيل الخروج</button>
                </div>
                <div id="adminAppList">
                    <p style="color:var(--text-muted);">جاري تحميل قائمة التطبيقات...</p>
                </div>
                <div id="adminFormContainer"></div>
            `;
            renderAdminAppList();
        }

        async function renderAdminAppList() {
            const listContainer = document.getElementById('adminAppList');
            if (!listContainer) return;
            if (allApps.length === 0) {
                listContainer.innerHTML =
                    '<p style="color:var(--text-muted);text-align:center;">لا توجد تطبيقات حالياً. أضف أول تطبيق!</p>';
                return;
            }
            listContainer.innerHTML = allApps.map(app => `
                <div class="admin-app-list-item">
                    <span>${app.iconUrl ? `<img src="${app.iconUrl}" style="width:28px;height:28px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-left:6px;" onerror="this.style.display='none';">` : ''} 
                    <strong>${app.name || 'بدون اسم'}</strong> · ${app.category || 'بدون فئة'} · ⬇️${app.downloads || 0}</span>
                    <div class="actions">
                        <button class="btn btn-outline btn-xs" onclick="showEditAppForm('${app.id}')">✏️ تعديل</button>
                        <button class="btn btn-danger btn-xs" onclick="deleteApp('${app.id}')">🗑️ حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function showAddAppForm() {
            editingAppId = null;
            const formContainer = document.getElementById('adminFormContainer');
            if (!formContainer) return;
            formContainer.innerHTML = getAppFormHTML();
            formContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function showEditAppForm(appId) {
            editingAppId = appId;
            const app = allApps.find(a => a.id === appId);
            if (!app) return;
            const formContainer = document.getElementById('adminFormContainer');
            if (!formContainer) return;
            formContainer.innerHTML = getAppFormHTML(app);
            formContainer.scrollIntoView({ behavior: 'smooth' });
        }

        function getAppFormHTML(app = null) {
            const isEdit = !!app;
            return `
                <hr style="margin:20px 0;border-color:var(--border);">
                <h3>${isEdit ? '✏️ تعديل التطبيق' : '➕ إضافة تطبيق جديد'}</h3>
                <div class="form-group">
                    <label for="appName">اسم التطبيق (بالعربية) *</label>
                    <input type="text" id="appName" value="${app?.name || ''}" placeholder="مثال: واتساب بلس" required>
                </div>
                <div class="form-group">
                    <label for="appNameEn">اسم التطبيق (إنجليزي - للبحث)</label>
                    <input type="text" id="appNameEn" value="${app?.nameEn || ''}" placeholder="مثال: WhatsApp Plus">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="appCategory">الفئة *</label>
                        <select id="appCategory">
                            <option value="mobile" ${app?.category === 'mobile' ? 'selected' : ''}>📱 تطبيقات الهاتف</option>
                            <option value="desktop" ${app?.category === 'desktop' ? 'selected' : ''}>💻 تطبيقات الحاسوب</option>
                            <option value="games" ${app?.category === 'games' ? 'selected' : ''}>🎮 ألعاب</option>
                            <option value="tools" ${app?.category === 'tools' ? 'selected' : ''}>🛠️ أدوات</option>
                            <option value="education" ${app?.category === 'education' ? 'selected' : ''}>📚 تعليم</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="appVersion">الإصدار</label>
                        <input type="text" id="appVersion" value="${app?.version || ''}" placeholder="مثال: 2.5.1">
                    </div>
                </div>
                <div class="form-group">
                    <label for="appShortDesc">وصف مختصر (يظهر في البطاقة) *</label>
                    <textarea id="appShortDesc" rows="2" placeholder="وصف قصير لا يتجاوز سطرين...">${app?.shortDesc || ''}</textarea>
                </div>
                <div class="form-group">
                    <label for="appFullDesc">وصف كامل (يظهر في صفحة التفاصيل)</label>
                    <textarea id="appFullDesc" rows="4" placeholder="الوصف الكامل للتطبيق مع جميع الميزات...">${app?.fullDesc || ''}</textarea>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="appSize">الحجم</label>
                        <input type="text" id="appSize" value="${app?.size || ''}" placeholder="مثال: 45 MB">
                    </div>
                    <div class="form-group">
                        <label for="appDeveloper">المطور</label>
                        <input type="text" id="appDeveloper" value="${app?.developer || ''}" placeholder="اسم المطور">
                    </div>
                </div>
                <div class="form-group">
                    <label for="appRequirements">المتطلبات</label>
                    <input type="text" id="appRequirements" value="${app?.requirements || ''}" placeholder="مثال: Android 8.0+, Windows 10+">
                </div>
                <div class="form-group">
                    <label for="appIconUrl">رابط أيقونة التطبيق (URL)</label>
                    <input type="url" id="appIconUrl" value="${app?.iconUrl || ''}" placeholder="https://example.com/icon.png">
                </div>
                <!-- حقل رفع الملف عبر Cloudinary -->
                <div class="form-group">
                    <label>ملف التطبيق (APK, EXE, ZIP...)</label>
                    <button type="button" class="btn btn-outline btn-sm" onclick="openCloudinaryUploader()">
                        📤 رفع الملف إلى Cloudinary
                    </button>
                    <small style="display:block;margin-top:6px;color:var(--text-muted);">
                        عند رفع الملف سيتم تعبئة حقل رابط التحميل تلقائياً.
                    </small>
                    <input type="hidden" id="appDownloadUrl" value="${app?.downloadUrl || ''}">
                    <div id="uploadStatus" style="margin-top:8px;font-weight:600;color:var(--primary);">
                        ${app?.downloadUrl ? '✅ رابط موجود مسبقاً: ' + app.downloadUrl.substring(0,45) + '...' : ''}
                    </div>
                </div>
                <div class="form-group">
                    <label for="appTags">وسوم (مفصولة بفواصل - للمساعدة في البحث)</label>
                    <input type="text" id="appTags" value="${(app?.tags || []).join(', ')}" placeholder="مثال: تواصل, شات, مراسلة">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="appFeatured" ${app?.featured ? 'checked' : ''}> 
                        تطبيق مميز (يظهر بشارة خاصة)
                    </label>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;">
                    <button class="btn btn-primary" onclick="saveApp()">💾 ${isEdit ? 'تحديث التطبيق' : 'حفظ التطبيق'}</button>
                    <button class="btn btn-ghost" onclick="document.getElementById('adminFormContainer').innerHTML='';editingAppId=null;">إلغاء</button>
                </div>
            `;
        }

        // ==================== CLOUDINARY UPLOADER ====================
        function openCloudinaryUploader() {
            if (!CLOUDINARY_CLOUD_NAME || CLOUDINARY_CLOUD_NAME === "YOUR_CLOUD_NAME") {
                showToast('⚠️ لم يتم تعيين اسم Cloudinary', 'error');
                return;
            }
            cloudinary.openUploadWidget({
                cloudName: CLOUDINARY_CLOUD_NAME,
                uploadPreset: CLOUDINARY_UPLOAD_PRESET,
                sources: ['local', 'url'],
                resourceType: 'auto',
                clientAllowedFormats: ['apk', 'exe', 'dmg', 'zip', 'rar', 'ipa', '7z', 'tar.gz'],
                maxFileSize: 200000000, // 200MB
            }, (error, result) => {
                if (error) {
                    showToast('❌ فشل الرفع: ' + error.message, 'error');
                    return;
                }
                if (result && result.event === 'success') {
                    const downloadUrl = result.info.secure_url;
                    document.getElementById('appDownloadUrl').value = downloadUrl;
                    document.getElementById('uploadStatus').innerHTML = `✅ تم الرفع بنجاح! <a href="${downloadUrl}" target="_blank">${downloadUrl.substring(0,50)}...</a>`;
                    showToast('✅ تم رفع الملف إلى Cloudinary', 'success');
                }
            });
        }

        // ==================== SAVE APP ====================
        async function saveApp() {
            const name = document.getElementById('appName').value.trim();
            const shortDesc = document.getElementById('appShortDesc').value.trim();
            const downloadUrl = document.getElementById('appDownloadUrl').value.trim();

            if (!name) { showToast('⚠️ اسم التطبيق مطلوب', 'error'); return; }
            if (!shortDesc) { showToast('⚠️ الوصف المختصر مطلوب', 'error'); return; }
            if (!downloadUrl) { showToast('⚠️ يجب رفع ملف التطبيق أو إدخال رابط التحميل', 'error'); return; }

            const appData = {
                name: name,
                nameEn: document.getElementById('appNameEn').value.trim(),
                category: document.getElementById('appCategory').value,
                version: document.getElementById('appVersion').value.trim(),
                shortDesc: shortDesc,
                fullDesc: document.getElementById('appFullDesc').value.trim(),
                size: document.getElementById('appSize').value.trim(),
                developer: document.getElementById('appDeveloper').value.trim(),
                requirements: document.getElementById('appRequirements').value.trim(),
                iconUrl: document.getElementById('appIconUrl').value.trim(),
                downloadUrl: downloadUrl,
                tags: document.getElementById('appTags').value.split(',').map(t => t.trim()).filter(Boolean),
                featured: document.getElementById('appFeatured').checked,
            };

            try {
                if (editingAppId) {
                    await updateAppInFirestore(editingAppId, appData);
                    showToast('✅ تم تحديث التطبيق بنجاح', 'success');
                } else {
                    await addAppToFirestore(appData);
                    showToast('✅ تمت إضافة التطبيق بنجاح', 'success');
                }
                editingAppId = null;
                document.getElementById('adminFormContainer').innerHTML = '';
                await refreshApps();
                renderAdminAppList();
                renderApps();
            } catch (error) {
                console.error('Error saving app:', error);
                showToast('❌ حدث خطأ أثناء حفظ التطبيق. تأكد من اتصال Firebase.', 'error');
            }
        }

        async function deleteApp(appId) {
            if (!confirm('هل أنت متأكد من حذف هذا التطبيق؟ لا يمكن التراجع عن هذا الإجراء.')) return;
            try {
                await deleteAppFromFirestore(appId);
                showToast('🗑️ تم حذف التطبيق', 'info');
                await refreshApps();
                renderAdminAppList();
                renderApps();
            } catch (error) {
                console.error('Error deleting app:', error);
                showToast('❌ حدث خطأ أثناء الحذف', 'error');
            }
        }

        async function refreshApps() {
            allApps = await fetchApps();
            renderApps();
            if (document.getElementById('adminAppList')) renderAdminAppList();
        }

        // ==================== EVENT LISTENERS ====================
        appModalOverlay.addEventListener('click', (e) => {
            if (e.target === appModalOverlay) closeModal();
        });

        adminOverlay.addEventListener('click', (e) => {
            if (e.target === adminOverlay) closeAdminPanel();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (!appModalOverlay.classList.contains('hidden')) closeModal();
                if (!adminOverlay.classList.contains('hidden')) closeAdminPanel();
            }
        });

        // تغيير شكل الهيدر عند التمرير
        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // ==================== بدء الموقع ====================
        createParticles();
        refreshApps();
        console.log('🚀 مكتبتك الرقمية جاهزة!');
    </script>
</body>
</html>
